[ARTS]
################################################################################
#                           ARTS Configuration File
################################################################################

#===============================================================================
# THREADING
#===============================================================================

# Worker threads per node (default: 4)
# For multi-node: total = worker_threads + sender_threads + receiver_threads
# For single-node: sender + receiver threads are reclaimed as workers
worker_threads=64

# Thread stack size in bytes (default: 0 = use system default)
#stack_size=0

#===============================================================================
# HARDWARE PINNING
#===============================================================================

# Enable thread pinning (default: 1)
pin=0

#===============================================================================
# SCHEDULING
#===============================================================================

# Scheduler type (default: 0)
# 0 = CPU scheduler, 3 = GPU scheduler
#scheduler=0

# Initial worker deque size (default: 4096)
worker_init_deque_size=2048

# Routing table size as power of 2 (default: 16 -> 2^16 entries)
route_table_size=16

# Auto-shutdown: terminate when all EDTs complete (default: 0)
# Adds overhead from global EDT tracking; use explicit arts_shutdown() instead
#auto_shutdown=0

#===============================================================================
# GPU SUPPORT
#===============================================================================
# To enable GPU support: set scheduler=3 and gpu=NumGPUs

# Number of GPUs (default: 0)
#gpu=8

# GPU route table size as power of 2 (default: 12 -> 2^12 entries)
#gpu_route_table_size=12

# Locality policies (default: 0)
# 0=random, 1=allOrNothing, 2=atLeastOne
#gpu_locality=0

# Fit policies (default: 0)
# 0=firstFit, 1=bestFit, 2=worstFit, 3=roundRobinFit
#gpu_fit=0

# Location Consistency Sync (default: 0)
# 0=artsGetLatestGpuDb, 1=artsGetRandomGpuDb
#gpu_lc_sync=0

# Max concurrent EDTs on GPU (default: -1 = unlimited)
#gpu_max_edts=-1

# Max GPU memory in bytes (default: -1 = unlimited)
#gpu_max_memory=-1

# Enable GPU P2P transfers (default: 0)
#gpu_p2p=0

# Enable GPU stream buffering (default: 0)
#gpu_buff_on=0

# Free datablock after GPU run - for testing only (default: 0)
#free_db_after_gpu_run=0

# Run GPU garbage collection when idle (default: 1)
#run_gpu_gc_idle=1

# Run GPU garbage collection before EDT - for testing only (default: 0)
#run_gpu_gc_pre_edt=0

# Delete zeros in GPU garbage collection (default: 1)
#delete_zeros_gpu_gc=1

#===============================================================================
# NETWORKING
#===============================================================================

# Network sender threads (default: 0 for local, 1 for multi-node)
sender_threads=0

# Network receiver threads (default: 0 for local, 1 for multi-node)
receiver_threads=0

# Number of parallel network connections per node pair (default: 1)
port_count=1

# Network interface - eth0, eth1, ib0, ib1, etc (default: auto-detect)
#net_interface=eth0
#net_interface=ib0

#===============================================================================
# LAUNCHER
#===============================================================================

# Launcher type: ssh or local (default: ssh)
# SLURM/LSF environments are auto-detected from SLURM_*/LSB_* env vars
# and override this setting
#
# Local multi-node simulation (all nodes on this machine):
#   launcher=local
#   node_count=4
#   default_ports=34739           # auto-offsets to 34739..34742
# Or with explicit per-node ports:
#   launcher=local
#   nodes=localhost:34739,localhost:34740,localhost:34741,localhost:34742
launcher=local

# Master node hostname (default: first node in list)
master_node=localhost

# Number of nodes (default: auto-detected from nodes list)
node_count=2

# Node list - supported formats:
#   nodes=hostname                    - Single node, uses global port
#   nodes=hostname:port               - Single node with specific port
#   nodes=node1,node2,node3           - Multiple nodes, uses global port
#   nodes=node1:port1,node2:port2     - Multiple nodes with per-node ports
#   nodes=node[01-10]:port            - Range expansion (node01 through node10)
#   nodes=node[01-10]                 - Range without port (uses global port)
nodes=ca-fcp0,ca-fcp1

# Default network ports (default: 75563)
# Per-node ports in the nodes list override this: nodes=host1:34739,host2:34740
# Formats: 34739 | [34739-34740] | 34739,34800,34900
default_ports=34739

#===============================================================================
# DEBUG / UTILITY
#===============================================================================

# Enable core dumps (default: 0)
core_dump=1

# Kill mode - terminate previous runs on SSH nodes (default: 0)
kill_mode=0

#===============================================================================
# PERFORMANCE COUNTERS
#===============================================================================

# Counter output folder (default: "./counters")
#counter_folder=./counters

# Counter capture interval in milliseconds (default: 100)
#counter_capture_interval=100

# ARTS Framework Counter Configuration
# =====================================
#
# Format: COUNTER_NAME=counterMode[,counterLevel[,reduceMethod]]
#
# counterMode (required when enabling a counter):
#   OFF      - Counter disabled
#   ONCE     - Single value captured at the end (no periodic capture)
#   PERIODIC - Periodic capture during execution
#
# counterLevel (optional, default: NODE):
#   THREAD   - Per-thread output (no reduction across threads)
#   NODE     - Per-node output (reduce values across threads)
#   CLUSTER  - Per-cluster output (reduce values across all nodes)
#
# reduceMethod (optional, default: SUM):
#   SUM      - Sum values across threads/nodes
#   MAX      - Maximum value across threads/nodes
#   MIN      - Minimum value across threads/nodes
#   MASTER   - Use master thread/node's value only (no reduction)
#
# Examples:
#   EDT_RUNNING_TIME=OFF                     # Disabled
#   EDT_RUNNING_TIME=ONCE                    # Single value at end, NODE level, SUM reduce (defaults)
#   EDT_RUNNING_TIME=ONCE,NODE               # Single value at end, NODE level, SUM reduce
#   EDT_RUNNING_TIME=ONCE,THREAD             # Single value at end, per-thread output
#   EDT_RUNNING_TIME=PERIODIC                # Periodic capture, NODE level, SUM reduce (defaults)
#   EDT_RUNNING_TIME=PERIODIC,THREAD         # Periodic capture, per-thread output
#   EDT_RUNNING_TIME=PERIODIC,NODE,MAX       # Periodic capture, per-node output, MAX reduce
#   EDT_RUNNING_TIME=PERIODIC,CLUSTER,SUM    # Periodic capture, cluster-wide, SUM reduce
#   INITIALIZATION_TIME=ONCE,CLUSTER,MASTER  # Single value, cluster level, master node only
#
# Edit this file to configure counters, then re-run: cmake

# =============================================================================
# Counters - Event counting and timing
# =============================================================================

# EDT (Event-Driven Task) Counters
EDT_RUNNING_TIME=PERIODIC,CLUSTER
NUM_EDTS_CREATED=PERIODIC,CLUSTER
NUM_EDTS_ACQUIRED=PERIODIC,CLUSTER
NUM_EDTS_FINISHED=PERIODIC,CLUSTER

# DB (Data Block) Counters
NUM_DBS_CREATED=PERIODIC,CLUSTER

# Memory Counters
MEMORY_FOOTPRINT=PERIODIC,CLUSTER

# Remote Counters
REMOTE_BYTES_SENT=PERIODIC,CLUSTER
REMOTE_BYTES_RECEIVED=PERIODIC,CLUSTER

# =============================================================================
# Acquire-Mode Override Counters
# =============================================================================
# Track acquire-mode override effectiveness
ACQUIRE_READ_MODE=OFF              # Count of READ mode acquisitions
ACQUIRE_WRITE_MODE=OFF             # Count of WRITE mode acquisitions
OWNER_UPDATES_SAVED=OFF            # Count of owner updates avoided via READ override
OWNER_UPDATES_PERFORMED=OFF        # Count of owner updates performed

# =============================================================================
# ARTS ID Tracking Counters (for ArtsMate integration)
# =============================================================================
# Track performance metrics per arts_id (compiler-assigned unique identifier)
# This enables linking compile-time metadata with runtime performance data
ARTS_ID_EDT_METRICS=OFF             # Per-arts_id EDT aggregate metrics (hash table)
ARTS_ID_DB_METRICS=OFF              # Per-arts_id DB aggregate metrics (hash table)
ARTS_ID_EDT_CAPTURES=OFF            # Per-arts_id EDT detailed captures (ArrayList)
ARTS_ID_DB_CAPTURES=OFF             # Per-arts_id DB detailed captures (ArrayList)

# =============================================================================
# Per-Node Timing Counters (CLUSTER level only)
# =============================================================================
# Track high-level timing for the ARTS runtime phases
# These are restricted to CLUSTER level and use master node measurements only
INITIALIZATION_TIME=ONCE,CLUSTER,MASTER  # Time spent in ARTS initialization phase
END_TO_END_TIME=ONCE,CLUSTER,MASTER      # Total end-to-end execution time

# ARTS Framework Counter Configuration
# =====================================
#
# Format: COUNTER_NAME=counterMode[,counterLevel[,reduceMethod]]
#
# counterMode (required when enabling a counter):
#   OFF      - Counter disabled
#   ONCE     - Single value captured at the end (no periodic capture)
#   PERIODIC - Periodic capture during execution
#
# counterLevel (optional, default: NODE):
#   THREAD   - Per-thread output (no reduction across threads)
#   NODE     - Per-node output (reduce values across threads)
#   CLUSTER  - Per-cluster output (reduce values across all nodes)
#
# reduceMethod (optional, default: SUM):
#   SUM      - Sum values across threads/nodes
#   MAX      - Maximum value across threads/nodes
#   MIN      - Minimum value across threads/nodes
#   MASTER   - Use master thread/node's value only (no reduction)
#
# Naming convention:
#   TIME_*  - Timer counters (nanoseconds, use START/STOP)
#   NUM_*   - Count counters (event occurrences, use INCREMENT_BY)
#   BYTES_* - Byte counters (accumulated bytes, use INCREMENT/DECREMENT_BY)
#
# Edit this file to configure counters, then re-run: cmake

# =============================================================================
# EDT Lifecycle — Time
# =============================================================================

# Wall-clock time spent executing EDT user functions (paused during yield/wait)
TIME_EDT_EXEC=PERIODIC,CLUSTER

# Time spent in arts_edt_create() — GUID allocation, metadata setup, route table
TIME_EDT_CREATE=OFF

# Time spent in EDT dependency signaling (internal_signal_edt)
TIME_EDT_SIGNAL=OFF

# Time spent saving/restoring EDT thread-local context during preemption
TIME_CONTEXT_SWITCH=OFF

# =============================================================================
# EDT Lifecycle — Count
# =============================================================================

# Total number of EDTs created on this rank
NUM_EDT_CREATE=PERIODIC,CLUSTER

# Number of EDTs that resolved all dependencies and became ready to execute
NUM_EDT_ACQUIRE=PERIODIC,CLUSTER

# Number of EDTs that completed execution
NUM_EDT_FINISH=PERIODIC,CLUSTER

# Number of EDT dependency signals (arts_signal_edt calls)
NUM_EDT_SIGNAL=OFF

# Count of voluntary EDT yields (arts_yield and arts_wait_on_handle)
NUM_YIELD=OFF

# =============================================================================
# DB Lifecycle — Time
# =============================================================================

# Time spent in arts_db_create() — allocation, route table insertion, data copy
TIME_DB_CREATE=OFF

# Time spent in arts_get_from_db() — remote DataBlock read operations
TIME_DB_GET=OFF

# Time spent in arts_put_in_db() — remote DataBlock write operations
TIME_DB_PUT=OFF

# =============================================================================
# DB Lifecycle — Count
# =============================================================================

# Total number of DataBlocks created on this rank
NUM_DB_CREATE=PERIODIC,CLUSTER

# Number of arts_get_from_db() calls (remote DB read requests)
NUM_DB_GET=OFF

# Number of arts_put_in_db() calls (remote DB write requests)
NUM_DB_PUT=OFF

# Number of arts_db_destroy() calls
NUM_DB_DESTROY=OFF

# Number of arts_db_move() calls (ownership transfers)
NUM_DB_MOVE=OFF

# Count of READ-mode DataBlock acquisitions during dependency resolution
NUM_DB_ACQUIRE_READ=OFF

# Count of WRITE-mode DataBlock acquisitions during dependency resolution
NUM_DB_ACQUIRE_WRITE=OFF

# Count of owner updates avoided because EDT used READ access (no writeback)
NUM_OWNER_UPDATE_SAVED=OFF

# Count of owner updates performed because EDT used WRITE access (writeback)
NUM_OWNER_UPDATE_PERFORMED=OFF

# =============================================================================
# DB Lifecycle — Bytes
# =============================================================================

# Total bytes of DataBlock data allocated via arts_db_create()
BYTES_DB_CREATE=OFF

# Total bytes written via arts_put_in_db()
BYTES_DB_PUT=OFF

# =============================================================================
# Memory — Bytes
# =============================================================================

# Running total of allocated minus freed bytes (current heap footprint)
BYTES_MEMORY_FOOTPRINT=PERIODIC,CLUSTER

# =============================================================================
# Network — Bytes
# =============================================================================

# Total bytes sent over the network to remote ranks
BYTES_REMOTE_SENT=PERIODIC,CLUSTER

# Total bytes received from the network from remote ranks
BYTES_REMOTE_RECEIVED=PERIODIC,CLUSTER

# =============================================================================
# Network — Count
# =============================================================================

# Number of remote messages sent (per arts_actual_send call)
NUM_REMOTE_SEND=PERIODIC,CLUSTER

# Number of remote messages received (per completed packet)
NUM_REMOTE_RECEIVE=PERIODIC,CLUSTER

# =============================================================================
# Network — Time
# =============================================================================

# Time spent in arts_remote_memory_move() — sending local DB data to remote node
TIME_REMOTE_MOVE=OFF

# =============================================================================
# Event — Time
# =============================================================================

# Time spent in arts_event_create()
TIME_EVENT_CREATE=OFF

# Time spent in arts_persistent_event_create()
TIME_PERSISTENT_EVENT_CREATE=OFF

# Time spent in arts_event_satisfy_slot() — signaling all dependents
TIME_EVENT_SIGNAL=OFF

# Time spent in arts_persistent_event_satisfy() — signaling when latch reaches 0
TIME_PERSISTENT_EVENT_SIGNAL=OFF

# =============================================================================
# Event — Count
# =============================================================================

# Number of arts_event_create() calls
NUM_EVENT_CREATE=OFF

# Number of arts_event_satisfy_slot() calls
NUM_EVENT_SIGNAL=OFF

# Number of arts_persistent_event_create() calls
NUM_PERSISTENT_EVENT_CREATE=OFF

# Number of arts_persistent_event_satisfy() calls
NUM_PERSISTENT_EVENT_SIGNAL=OFF

# =============================================================================
# Scheduling
# =============================================================================

# Number of work-stealing attempts (arts_runtime_steal_from_worker entries)
NUM_STEAL_ATTEMPT=OFF

# Number of successful work steals (non-NULL deque pop_back)
NUM_STEAL_SUCCESS=OFF

# Time spent in arts_yield / arts_wait_on_handle (sleeping/waiting)
TIME_YIELD=OFF

# =============================================================================
# Epoch
# =============================================================================

# Number of epoch creations (arts_initialize_epoch / epoch pool allocations)
NUM_EPOCH_CREATE=OFF

# =============================================================================
# Out-of-Order
# =============================================================================

# Number of OO list insertions (deferred operations for not-yet-created targets)
NUM_OO_ENQUEUE=OFF

# =============================================================================
# Object Counters — Per arts_id Tracking
# =============================================================================
# Track per-object (per arts_id) performance metrics.
# Each counter tracks the specified metric aggregated by unique arts_id values.
# Enabling any EDT counter activates the per-thread EDT hash table.
# Enabling any DB counter activates the per-thread DB hash table.
# Output is written to separate object_n{id}.json / object.json files.

# Per-object EDT metrics (aggregate)
OBJ_NUM_EDT=OFF
OBJ_TIME_EDT_EXEC=OFF
OBJ_TIME_EDT_STALL=OFF

# Per-object DB metrics (aggregate)
OBJ_NUM_DB=OFF
OBJ_BYTES_DB_LOCAL=OFF
OBJ_BYTES_DB_REMOTE=OFF
OBJ_NUM_DB_CACHE_MISS=OFF

# Per-object traces (detailed per-invocation records)
OBJ_TRACE_EDT=OFF
OBJ_TRACE_DB=OFF

# =============================================================================
# Runtime Phases — Time (CLUSTER level only)
# =============================================================================
# High-level timing for ARTS runtime phases.
# Restricted to CLUSTER level; uses master node measurement only.

# Time spent in ARTS initialization (config, network, threads, barriers)
TIME_INIT=ONCE,CLUSTER,MASTER

# Total end-to-end execution time (from init complete to shutdown)
TIME_TOTAL=ONCE,CLUSTER,MASTER

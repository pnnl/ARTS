[ARTS]
################################################################################
#                    ARTS Multi-Node Configuration File
#
# For testing multi-node execution on a single machine via SSH.
# Launches 2 processes on localhost with different ports.
################################################################################

#===============================================================================
# THREADING
#===============================================================================

# Reduced worker threads — 2 processes share the same machine
worker_threads=190

#===============================================================================
# HARDWARE PINNING
#===============================================================================

# Disable pinning — both processes share the same cores
pin=0

#===============================================================================
# SCHEDULING
#===============================================================================

worker_init_deque_size=2048
route_table_size=16

#===============================================================================
# NETWORKING
#===============================================================================

sender_threads=1
receiver_threads=1
port_count=1

#===============================================================================
# LAUNCHER
#===============================================================================

launcher=ssh
master_node=ca-fcp0
node_count=4
nodes=ca-fcp0,ca-fcp1,ca-fcp2,ca-fcp3
default_ports=50000

#===============================================================================
# DEBUG / UTILITY
#===============================================================================

core_dump=1
kill_mode=0

#===============================================================================
# CXL (Compute Express Link) — only active when built with ARTS_USE_CXL=1
#===============================================================================

# CXL DB allocation strategy (default: static)
# Options:
#   static      — all DB allocations go to a single fixed device
#   round_robin — DB allocations are distributed across devices
cxl_db_allocation_strategy=round_robin

# CXL device index used for static allocation (default: 0)
# Only read when cxl_db_allocation_strategy=static
cxl_db_allocation_device=0

#===============================================================================
# PERFORMANCE COUNTERS
#===============================================================================

# Counter output folder (default: "./counters")
counter_folder=./counters

# Counter capture interval in milliseconds (default: 100)
counter_capture_interval=100
[ARTS]
################################################################################
#                     ARTS GPU Configuration File
#
# Enables GPU scheduler with 1 GPU for GPU test execution.
################################################################################

#===============================================================================
# THREADING
#===============================================================================

worker_threads=4
pin_stride=1

#===============================================================================
# SCHEDULING
#===============================================================================

# GPU scheduler (required for GPU tests)
scheduler=3

worker_init_deque_size=2048
route_table_size=16

#===============================================================================
# GPU SUPPORT
#===============================================================================

gpu=1
gpu_route_table_size=12

#===============================================================================
# NETWORKING
#===============================================================================

sender_threads=1
receiver_threads=1
port_count=1

#===============================================================================
# LAUNCHER
#===============================================================================

launcher=ssh
master_node=localhost
node_count=1
nodes=localhost
default_ports=34739

#===============================================================================
# DEBUG / UTILITY
#===============================================================================

core_dump=1
kill_mode=0

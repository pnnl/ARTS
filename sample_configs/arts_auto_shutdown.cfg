[ARTS]
################################################################################
#                    ARTS Auto-Shutdown Configuration File
#
# Same 2-node localhost layout as arts.cfg, with the runtime's automatic
# termination-detection enabled. Used exclusively by tests/termination_detection.
################################################################################

#===============================================================================
# THREADING
#===============================================================================

worker_threads=8

#===============================================================================
# HARDWARE PINNING
#===============================================================================

# Enable pinning — shared_pu_pool auto-offsets per rank in local launcher
# (rank 0: PUs 0..N-1, rank 1: PUs N..2N-1, ...)
pin=1

#===============================================================================
# SCHEDULING
#===============================================================================

worker_init_deque_size=2048
route_table_size=16

#===============================================================================
# NETWORKING
#===============================================================================

sender_threads=1
receiver_threads=1
port_count=1

#===============================================================================
# LAUNCHER
#===============================================================================

launcher=local
master_node=localhost
node_count=2
nodes=localhost:50002,localhost:50003
default_ports=50002

#===============================================================================
# TERMINATION DETECTION
#===============================================================================

auto_shutdown=1

#===============================================================================
# DEBUG / UTILITY
#===============================================================================

core_dump=1
kill_mode=0

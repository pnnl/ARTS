[ARTS]
################################################################################
#                    ARTS Single-Node Configuration File
#
# True single-rank configuration for termination-path tests. Uses port
# 50050 (distinct from arts.cfg/arts_multinode.cfg's 50000/50001 and
# arts_auto_shutdown.cfg's 50002/50003).
################################################################################

#===============================================================================
# THREADING
#===============================================================================

worker_threads=4

#===============================================================================
# HARDWARE PINNING
#===============================================================================

pin=0

#===============================================================================
# SCHEDULING
#===============================================================================

worker_init_deque_size=2048
route_table_size=12

#===============================================================================
# NETWORKING
#===============================================================================

sender_threads=0
receiver_threads=0
port_count=1

#===============================================================================
# LAUNCHER
#===============================================================================

launcher=local
master_node=localhost
node_count=1
nodes=localhost:50050
default_ports=50050

#===============================================================================
# DEBUG / UTILITY
#===============================================================================

core_dump=1
kill_mode=0

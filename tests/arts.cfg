[ARTS]
################################################################################
#                    ARTS Multi-Node Configuration File
#
# For testing multi-node execution on a single machine via SSH.
# Launches 2 processes on localhost with different ports.
################################################################################

#===============================================================================
# THREADING
#===============================================================================

# Reduced worker threads — 2 processes share the same machine
worker_threads=8

#===============================================================================
# HARDWARE PINNING
#===============================================================================

# Enable pinning — shared_pu_pool auto-offsets per rank in local launcher
# (rank 0: PUs 0..N-1, rank 1: PUs N..2N-1, ...)
pin=1

#===============================================================================
# SCHEDULING
#===============================================================================

worker_init_deque_size=2048
route_table_size=16

#===============================================================================
# NETWORKING
#===============================================================================

sender_threads=1
receiver_threads=1
port_count=1

#===============================================================================
# LAUNCHER
#===============================================================================

launcher=local
master_node=localhost
node_count=2
nodes=localhost:50000,localhost:50001
default_ports=50000

#===============================================================================
# DEBUG / UTILITY
#===============================================================================

core_dump=1
kill_mode=0

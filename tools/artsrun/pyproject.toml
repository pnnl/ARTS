[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artsrun"
version = "0.1.0"
description = "Selection, build and run driver for ARTS experiments"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "textual>=0.80",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "ruamel.yaml>=0.18",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Figure generation (artsrun sweepfig); the runner itself never needs it, so
# a scheduler-only host can skip the plotting stack.
fig = ["matplotlib>=3.8"]

[project.scripts]
artsrun = "artsrun.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artsrun"]

[tool.pytest.ini_options]
testpaths = ["tests"]

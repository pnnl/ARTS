  nekbone_dist:
    binary: nekbone_dist
    class: spmd
    provenance: 'Nekbone (Nek5000 proxy); reduction restructured'
    marker: 'FinalEDT'
    scalar_re: 'CGloop_stop> rnormfinal(?:\^2)?\s*=\s*([0-9.eE+-]+)'
    tolerance: 1e-18
    extra_scalars:
      rnorminit: 'CGstep0_stop> rnorminit(?:\^2)?\s*=\s*([0-9.eE+-]+)'
    # Same lattice and same iteration count as the row it re-implements -- the
    # rewrite is in the all-reduce, not in the problem.  The tree reassociates
    # the sum differently, so the residual agrees to the tolerance rather than
    # bit-for-bit.
    expect: '3.95222063651471E-06'
    expect_args: ['18', '16', '12', '6', '6', '4', '8', '100']
    args: ['18', '16', '12', '6', '6', '4', '8', '100']

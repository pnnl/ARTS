  miniAMR_intel:
    binary: miniAMR_intel
    class: task
    provenance: 'miniAMR adaptive-mesh proxy (Mantevo); Intel OCR port'
    marker: 'Grand Total Checksum'
    scalar_re: 'Grand Total Checksum\s*==\s*([\-+0-9.eE]+)'
    tolerance: 1e-08
    # The base tier anti-scales (17x worse from one node to two), so the anchor
    # targets the short window, and the timestep count is what reaches it: this
    # row had been raised to 18x the program's own default, and coming back
    # down to 1.5x it puts the anchor at 21.2 / 19.1 / 22.1 s across the three
    # families at 7.8 GB.  The default itself, 20, is 15.7 s -- inside the
    # window but below the band the slowest arm should sit in.
    #
    # The CELLS PER BLOCK are deliberately not the knob, even though they look
    # like the size.  Halo goes as the block face and compute as its volume, so
    # shrinking the block raises the communication share of the run -- the
    # direction that flatters a coherence measurement, and therefore the one it
    # must not take.  It is not a width knob either, which is worth stating
    # because it looks like one: EDT creations are identical -- 1,943,799 --
    # at 16 and at 6 cells a block, so the block size buys and costs no
    # parallelism at all.  The timestep count scales compute and communication
    # together and leaves the decomposition alone.  Everything else is width
    # and is held: the
    # block grid, and num_vars/stages_per_ts (defaults, unstated) which with
    # the 26-neighbour halo are what make ~2,082 EDTs per block-timestep --
    # refinement turns 512 base blocks into millions of EDTs, so the machine is
    # covered by the block count, never by the block size.
    #
    # The checksum is a property of the mesh rather than of how long it runs,
    # so the pin survives the timestep change unaltered.
    #
    # No restructured version, by decision, on the same grounds as XSBench's
    # pair.  Placement alone dissolves this row's anti-scaling -- the hinted
    # tier turns 17x degradation into a 3.8x speed-up over the same node range
    # -- so there is nothing left for a redesign to overcome.  And the SPMD
    # re-decomposition of the same physics already exists as its own row
    # (miniAMR_intel_chandra, a rank grid rather than a dataflow DAG), whose
    # base carries a complete placement layer and scales as it stands; the two
    # rows ARE the decomposition ablation.
    expect: '144913203200.000000'
    expect_args: ['--nx', '16', '--ny', '16', '--nz', '16', '--npx', '8', '--npy', '8', '--npz', '8', '--num_tsteps', '30', '--num_objects', '1']
    args: ['--nx', '16', '--ny', '16', '--nz', '16', '--npx', '8', '--npy', '8', '--npz', '8', '--num_tsteps', '30', '--num_objects', '1']
    hinted: true


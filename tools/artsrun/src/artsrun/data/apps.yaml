# Application catalog: what each benchmark structurally is.
#
# Committed values are the ones that describe the application itself —
# its binary, how a completed run announces itself, how its result scalar
# is read, which versions exist, and the structural reasons a cell cannot
# run.  `args` is the calibrated strong-scaling workload and is the only
# field a benchset routinely overrides.
#
# `kind` separates what the program is from whether a campaign runs it. An
# application is one a field cites by name (graph500, HPCG, CoMD, XSBench,
# STREAM); a toy is named after an operation (globalsum, reduction,
# dbcreate) or after nothing, and exercises one runtime mechanism; an attack
# is an adversarial probe written for measurement, its knobs building each
# arm's best and worst case by construction. Upstream's own layout decides
# most of it: apps/kernels/ and apps/examples/ are toys, apps/<name>/ is an
# application.
#
# Versions: every application has `base` (as published, plus the disclosed
# structure-preserving conformance adaptations).  `hinted` exists where the
# source carries a placement hint layer (built as <binary>_hinted), and
# `restructured` where the task/data decomposition was redesigned and
# registered as its own target — the answer to a scaling problem that
# placement hints alone could not fix.

apps:
  basicIO:
    binary: basicIO
    class: task
    provenance: 'OCR file-input fixture'
    kind: toy
    marker: 'BASICIO_CHK'
    scalar_re: 'BASICIO_CHK\s+(\d+)'
    scalar_kind: int
    expect: '1'
    expect_args: ['0', '10', '{repo}/datasets/basicIO/basicIO_test.dat']
    args: ['0', '10', '{repo}/datasets/basicIO/basicIO_test.dat']
    fixtures: ['{repo}/datasets/basicIO/basicIO_test.dat']
    default_enabled: false

  cache_offset:
    binary: cache_offset
    class: task
    provenance: 'OCR datablock cache-offset probe'
    kind: toy
    marker: 'CACHE_OFFSET_CHK'
    scalar_re: 'CACHE_OFFSET_CHK\s+(\d+)'
    scalar_kind: int
    expect: '17592181850112'
    expect_args: []
    args: []
    default_enabled: false
  cholesky_blas:
    binary: cholesky_blas
    class: task
    provenance: 'Tiled Cholesky factorization over BLAS'
    marker: 'CHOLESKY trace'
    scalar_re: 'CHOLESKY trace\s*=\s*([0-9.eE+-]+)'
    tolerance: 1e-09
    # The tiled Cholesky, with BLAS3 kernels.  The hand-written-kernel port
    # shares this row's exact decomposition and is not registered: at eight
    # nodes the two are indistinguishable (15.48 s against 15.54 s), and its
    # slower kernels MASK what the campaign is measuring -- on the identical
    # DAG it anti-scales 1.55x where this one shows 4.97x.
    #
    # ts is the tile edge, t = ds/ts the tiles per dimension, so peak width is
    # t(t-1)/2 and the class rule -- four times the largest geometry's 3456
    # workers -- puts t at 167, which is ds=16700 at ts=100.  Identity input
    # gives a unit factor and a trace of exactly ds, so the pin is analytic.
    #
    # Input is the tile-stream binary.  Reading the same matrix as text costs
    # one fscanf per ELEMENT -- 100 million calls at this size, 7.05 s, which
    # was 85% of this row's anchor before --fib was ported to it.  Every
    # earlier calibration of this row measured the scanner.
    args: ['--ds', '16700', '--ts', '100', '--fib', '{repo}/datasets/cholesky/cholesky_perf16700_ts100.bin']
    expect: '16700'
    expect_args: ['--ds', '16700', '--ts', '100', '--fib', '{repo}/datasets/cholesky/cholesky_perf16700_ts100.bin']
    fixtures: ['{repo}/datasets/cholesky/cholesky_perf16700_ts100.bin']
    hinted: true

    restructured_as: cholesky_dist

  cholesky_dist:
    binary: cholesky_dist
    class: task
    provenance: 'Tiled Cholesky, place-persistent SPMD rewrite'
    marker: 'CHOLESKY trace'
    scalar_re: 'CHOLESKY trace\s*=\s*([\-+0-9.eE]+)'
    tolerance: 1e-06
    # The same factorisation and the same 2-D block-cyclic ownership as the row
    # it re-implements, decomposed so that each place builds its own tasks where
    # they run rather than one rank creating t^3/6 of them.  The answer is the
    # trace of the factor, which the identity input makes exactly ds; verified
    # against an independent sequential Cholesky on three non-trivial SPD
    # matrices where all 500,500 elements agree to 1.5e-15, and invariant across
    # places 1/2/4/8/16/32/64 and nodes 1/2/4/8.
    #
    # This is the cycle's one strong scaler, so it is calibrated against ~150 s
    # rather than 10-30 s.
    #
    # The two knobs divide cleanly and neither is tuned for speed: ts is the
    # WIDTH knob and the class rule fixes it, ds is the SIZE knob and the window
    # fixes that.  Peak width is t(t-1)/2 and the rule asks four times the
    # largest geometry's 3456 workers, so t >= 167; t=180 at ds=90000 makes
    # ts=500 and a peak of 16,110, which is 4.66x the workers.  A larger tile
    # runs faster and is not used: it would give 1.16x the workers instead of
    # 4x, and narrowing the width for a timing gain is what the rule forbids.
    #
    # Anchor across the three families: 145.5 s / 89 GB (val_wb — measured on
    # the combining build, pre-promotion name val_wb_comb),
    # 159.7 s / 83 GB (inv_wb), 151.8 s / 85 GB (excl_retain).  The tightest
    # decides, so the window figure is inv_wb's 160 s.  Memory does
    # not bound this row -- eight nodes hold 45 GB EACH, less than one node
    # does, because the tiles divide while the runtime's own structures do not
    # grow with the node count.  Per-node is the figure that matters: a runner
    # that sums VmRSS over the ranks it started reports a whole-machine total
    # when every rank is on the same host.
    #
    # The trend is taken at ds=40000 with ts UNCHANGED at 500 (15 workers a
    # node): 32.76 / 22.26 / 16.67 / 13.77 s, 2.38x from one node to eight.
    # The catalog arguments are run at the anchor and nowhere else: a node sweep
    # at that size is a campaign result, not a calibration input.  Shrinking
    # ts instead reverses the verdict -- ds=10000/ts=100 anti-scales, 2.30 s to
    # 6.07 s -- because arithmetic per byte moved goes with ts, so a fifth the
    # tile is a fifth the intensity and a different program.  A trend size must
    # shrink ds alone.
    args: ['--ds', '90000', '--ts', '500', '--places', '32', '--fib', '{repo}/datasets/cholesky/cholesky_perf90000_ts500.bin']
    expect: '90000'
    expect_args: ['--ds', '90000', '--ts', '500', '--places', '32', '--fib', '{repo}/datasets/cholesky/cholesky_perf90000_ts500.bin']
    fixtures: ['{repo}/datasets/cholesky/cholesky_perf90000_ts500.bin']
    restructured_from: cholesky_blas

  CoMD_intel_chandra:
    binary: CoMD_intel_chandra
    class: task
    provenance: 'CoMD (ExMatEx); Intel OCR port'
    # Atom migration mutates two cells through EW dependences, whose
    # exclusive-write guarantee this runtime maps onto per-node RW; the
    # sibling ports cover the same physics (CoMD_sdsc serial-redistribute,
    # CoMD_intel_chandra_tiled message-passing) without needing EW.
    unsupported: 'needs exclusive-write (EW) semantics the runtime does not implement'
    default_enabled: false
    marker: 'Initial energy'
    scalar_re: 'Initial energy\s*:\s*([\-+0-9.eE]+)'
    tolerance: 0.0001
    # The port reaches its wrap-up only through the kinetic-energy reduction,
    # which runs on print-period boundaries — a step count the period does
    # not divide never terminates.  The args keep -n dividing -N for that
    # reason (the row is disabled regardless; see unsupported above).
    args: ['-x', '60', '-y', '60', '-z', '60', '-N', '6', '-n', '6']

  CoMD_intel_chandra_tiled:
    binary: CoMD_intel_chandra_tiled
    class: spmd
    provenance: 'CoMD (ExMatEx); Intel OCR port, tiled rank grid'
    marker: 'Final energy'
    scalar_re: 'Final energy\s*:\s*([\-+0-9.eE]+)'
    tolerance: 1e-06
    # A strong scaler (52.4 -> 30.5 -> 19.3 -> 15.2 s over 1..8 reduced-
    # geometry ranks, 3.46x), so the box is sized against the ~150 s anchor.
    # The 24x12x12 rank grid is 3456 = one persistent chain per worker at the
    # largest campaign geometry, node-invariant, and -N 100 is the benchmark's
    # own default; the box is therefore the only knob, and it must be a
    # multiple of the grid, which leaves 240 and 264 with nothing between.
    #
    # MEMORY decides between them, and it is the binding constraint here
    # rather than the window.  Every link cell reserves MAXATOMS slots whether
    # or not atoms occupy them, so the resident set is set by the box at
    # startup: it does not move with the step count (209 GB at 10 steps and at
    # 50) nor across the arms.  264 would hit the window exactly at 149.4 s but
    # holds 225.6 GB, 88% of a node; 240 runs 104.1 / 104.5 / 105.9 s across
    # the three families at 201.6 GB.  The window is given up for the margin.
    expect: '-1.166049795862'
    expect_args: ['-x', '240', '-y', '240', '-z', '240', '-N', '100', '-n', '10', '-i', '24', '-j', '12', '-k', '12']
    args: ['-x', '240', '-y', '240', '-z', '240', '-N', '100', '-n', '10', '-i', '24', '-j', '12', '-k', '12']

  CoMD_sdsc:
    binary: CoMD_sdsc
    class: task
    provenance: 'CoMD molecular-dynamics proxy (ExMatEx); OCR port by SDSC'
    marker: 'Final energy'
    scalar_re: 'Final energy\s*:\s*([\-+0-9.eE]+)'
    tolerance: 1e-06
    # Anti-scaling anchor: each step re-wires a 24,389-box five-phase
    # fork-join over the wire, so the LONGEST cell is the LARGEST geometry
    # and -N (the duration knob; per-step structure is the invariant) is
    # sized by the 32-node budget, not by 1n -- measured per-step wall
    # 12.4/19.2/25.5 s at 2/4/8 ferrari nodes (~+6.5 s per doubling)
    # extrapolates to ~38 s/step at 32n, so -N 15 puts the worst cell
    # near the 600 s budget (1n is then ~12 s: correct for this class).
    # The period must divide -N or the final print's kinetic term is
    # stale.  Re-check the 32n extrapolation on Dane's fabric.
    expect: '-1.166054974646'
    expect_args: ['-x', '48', '-y', '48', '-z', '48', '-N', '15', '-n', '5']
    args: ['-x', '48', '-y', '48', '-z', '48', '-N', '15', '-n', '5']
    hinted: true

  CoMD_sdsc2:
    binary: CoMD_sdsc2
    class: task
    provenance: 'CoMD (ExMatEx); OCR port by SDSC (P. Cicotti)'
    # Same EW dependence as CoMD_intel_chandra: per-cell atom migration
    # needs one-EDT-at-a-time exclusivity the runtime does not provide.
    unsupported: 'needs exclusive-write (EW) semantics the runtime does not implement'
    default_enabled: false
    marker: 'Final energy'
    scalar_re: 'Final energy\s*:\s*([\-+0-9.eE]+)'
    tolerance: 0.0001
    expect: '-1.166063027842'
    expect_args: ['-x', '4', '-y', '4', '-z', '4', '-N', '2']
    args: ['-x', '44', '-y', '44', '-z', '44', '-N', '8']

  curvefit:
    binary: curvefit
    class: task
    provenance: 'OCR adaptive piecewise-linear fit demo (reports no result)'
    kind: toy
    marker: 'SUCCESS'
    scalar_kind: bool
    args: ['48', '0.01', '0.5', '1000000']
    default_enabled: false

  dbcreate_matrix:
    binary: dbcreate_matrix
    class: task
    provenance: 'Datablock-creation probe written for this driver'
    kind: toy
    marker: 'CELLS_OK='
    scalar_re: 'CELLS_OK=(\d+)/12'
    scalar_kind: int
    args: []
    default_enabled: false

  dbctrl:
    binary: dbctrl
    class: task
    provenance: 'OCR datablock lifecycle kernel'
    kind: toy
    marker: 'Total time'
    scalar_kind: bool
    args: ['6', '6', '1024']
    default_enabled: false

  fft:
    binary: fft
    class: task
    provenance: 'FFT, recursive form'
    marker: 'FFT checksum'
    scalar_re: 'FFT checksum\s*=\s*([\-+0-9.eE]+)'
    tolerance: 0.001
    # The one argument is a power: the transform is over 2^p points.  This tier
    # anti-scales, so its anchor window is 10-30 s rather than the ~150 s a
    # strong scaler gets, and the knob only doubles: 30 puts the anchor at
    # 16.7-19.3 s across the three coherence families, holding 13 GB.
    # The scalar is summed in the combine phase's slaves rather than swept
    # afterwards, so the summation is blocked rather than sequential and the
    # last digits moved -- 4.8e-11 relative, against a 1e-3 tolerance.
    expect: '1367130551.153591'
    expect_args: ['30']
    args: ['30']
    # The source carries a placement layer; the CMake entry had no
    # HINTED_PLACEMENT, so it had never been built.  Every task in the
    # recursion acquires the SAME block RW, so the layer cannot distribute the
    # work; what it can do is stop the block from chasing the recursion, by
    # placing a subtree where the part of the transform it owns lives.  That
    # covers every node -- pinning the recursion to its creator would leave one
    # node doing all of it, which wins by not using the machine.  Measured at
    # power 28 over 15 workers a node: base 8.96 s at one node and 304.26 s at
    # eight, this layer 8.85 s and 61.90 s.
    hinted: true
    restructured_as: fft_dist

  fft_dist:
    binary: fft_dist
    class: task
    provenance: 'FFT, Bailey four-step transpose rewrite'
    marker: 'FFT_DIST checksum'
    # It transforms a pure tone, whose spectrum is known in closed form
    # (X[5] = X[N-5] = N/2, every other bin zero), checks its own maximum bin
    # error against a tolerance, and prints the sum of the two peaks -- which
    # is why the pinned value is exactly 2^p.  A run that got the transform
    # wrong prints FFT_DIST INVALID instead and extracts nothing.
    scalar_re: 'FFT_DIST checksum\s*=\s*([\-+0-9.eE]+)'
    tolerance: 1e-06
    # Its own size, not the row it re-implements: a restructured tier is a
    # separate row with a separate window, and this one strong-scales (4.8x
    # from one node to eight), so it is calibrated against ~150 s while the
    # recursion is calibrated against 10-30 s.  What actually fixes the size
    # here is memory: at power 32 the anchor holds 176 GB in the widest of the
    # three families against a 256 GB node, and a power doubles it.  The second
    # argument is the tile count, this rewrite's decomposition, and the width
    # rule sets it.  The rewrite is a dataflow DAG, so the rule asks for ~4x the 3456
    # persistent units the largest geometry provides -- 13,824 -- and t is the
    # width of every phase.  t must be a power of two dividing both matrix
    # dimensions (65536 each at power 32), so 8192 is the nearest at or above.  The
    # decomposition is place-persistent: each place builds its own tiles where
    # it runs, and the transpose is packed per place in waves, so no phase is
    # wider or narrower than the rule set it.
    #
    # It is not the fastest tile count and is not meant to be: smaller tile
    # counts run faster and fill a fraction of the machine (t=128 is 257 tasks
    # against 3,456 workers), and performance is not a reason to narrow a
    # width.  What this width used to cost was a t*t exchange -- 67 million
    # blocks carrying four points each, which at eight nodes exhausted the
    # host.  The transpose is pair-wise instead: a place packs everything it
    # owes a peer into one block and the receiver's unpack cuts it into
    # per-reader blocks, so the count is P(P-1) whatever the width.  Splitting
    # the pack per destination row block removes the unpack but puts
    # places*waves*t blocks of 2 KB on the wire, which measured 5.3x WORSE at
    # eight nodes than at one.
    # The last argument is the place count -- the number of partitions the
    # program owns its work and aggregates its exchange in.  It is an argument
    # and not the rank count, so the task and datablock counts, and the order
    # the partials combine in, are identical in every geometry; the runtime
    # maps the places onto whatever ranks exist through a hint.  32 is one
    # place per node at the largest geometry, which is where the calibration
    # is taken, and it is the same convention XSBench's `-p 32` uses.
    expect: '4294967296.023932'
    expect_args: ['32', '8192', '32']
    args: ['32', '8192', '32']
    restructured_from: fft

  fibonacci:
    binary: fibonacci
    class: task
    provenance: 'Fibonacci recursion'
    marker: 'answer is\s*\d+'
    scalar_re: 'answer is\s*(\d+)'
    scalar_kind: int
    # Fork-join recursion with no data: the tree IS the decomposition, so the
    # only dials are the size and how deep the spawn scatters before subtrees
    # pin to the rank they landed on.  Scatter 11 gives 2048 distinct paths,
    # ample for 32 nodes, and sits on the measured plateau (9-14 within 3% at 4
    # and 8 nodes).
    #
    # The base tier anti-scales, so the size targets the 10-30 s window rather
    # than the ~150 s a strong scaler gets, and both tiers run it: the hint
    # layer is a no-op at one place, so the two share an anchor and the window
    # belongs to the tier that has to survive the whole node sweep.  n=40 puts
    # the anchor at 23.5 / 23.1 / 22.4 s across the three families and holds
    # 103 GB; n moves the anchor by the golden ratio, so 39 is 13.8 s and 41 is
    # 173 s -- there is no rung between them and 40 is the one in the window.
    expect: '102334155'
    expect_args: ['40', '11']
    args: ['40', '11']
    hinted: true

  globalsum_cgNoShim:
    binary: globalsum_cgNoShim
    class: task
    provenance: 'OCR global-sum implementation, CG driver without shim'
    kind: toy
    marker: 'CG0 T\d+\s+0 value'
    scalar_re: 'CG0 T100\s+0 value\s+([0-9.]+)'
    tolerance: 1e-05
    expect: '0.462231'
    expect_args: []
    args: []
    default_enabled: false

  globalsum_cgShim:
    binary: globalsum_cgShim
    class: task
    provenance: 'OCR global-sum implementation, CG driver with shim'
    kind: toy
    marker: 'CG0 T\d+\s+0 value'
    scalar_re: 'CG0 T\d+\s+0 value\s+([0-9.]+)'
    tolerance: 1e-05
    expect: '0.462231'
    expect_args: []
    args: []
    default_enabled: false

  globalsum_pcg:
    binary: globalsum_pcg
    class: task
    provenance: 'OCR global-sum implementation, preconditioned CG driver'
    kind: toy
    marker: 'CG0 T\d+\s+0 value'
    scalar_re: 'CG0 T\d+\s+0 value\s+([0-9.]+)'
    tolerance: 1e-05
    expect: '0.999794'
    expect_args: []
    args: []
    default_enabled: false

  graph500:
    binary: graph500
    class: task
    provenance: 'Graph500 BFS benchmark'
    marker: 'nodes \d+'
    scalar_re: 'nodes (\d+)'
    scalar_kind: int
    # The edge factor is the official benchmark's 16, which the app's own
    # README names; the row carried 8.  R and C are the worker grid and R*C
    # must divide 2^SCALE, so the dataflow-DAG rule's ~4x of 3456 rounds to
    # the nearest power of two that constraint permits: 128 x 128 = 16384.
    # SCALE is the size knob and 21 puts the anchor at 156.5s.
    #
    # The scalar is the sum of the workers' visited counts, so it is a
    # traversal result rather than an echo of SCALE -- but at an average
    # degree of 32 the giant component covers the graph, so it equals 2^SCALE
    # and catches a BFS that fails to reach vertices, not one that reaches
    # them with the wrong parent.  The source has full validation
    # (VALIDATION_MODE) but it runs inside the finish EDT, which is inside the
    # measured span.
    expect: '2097152'
    expect_args: ['21', '16', '128', '128']
    args: ['21', '16', '128', '128']
    # The shipped worker-to-place map is `w % places`, which scatters every
    # row and column partner on the R x C grid; the hinted tier tiles it.
    hinted: true
    extra_scalars:
      kernel2_ns: '\[kernel2 time ([0-9.eE+-]+)\]'
      mteps: 'mean MTEPS ([0-9.eE+-]+)'

  highbw:
    binary: highbw
    class: mw
    provenance: 'OCR high-bandwidth example'
    kind: toy
    marker: 'HIGHBW_WORK_SUM'
    scalar_re: 'HIGHBW_WORK_SUM\s*=\s*(\d+)'
    scalar_kind: int
    expect: '2048'
    expect_args: []
    args: ['48', '8388608', '1000']
    default_enabled: false

  hpcg_intel:
    binary: hpcg_intel
    class: spmd
    provenance: 'HPCG conjugate-gradient benchmark'
    marker: 'final deviation'
    scalar_re: 'final deviation:\s*([\-+0-9.eE]+)'
    tolerance: 0.0001
    expect: '24636871.685191'
    expect_args: ['16', '16', '16', '32', '50']
    # The first three arguments are the rank grid and the fourth the edge of the
    # cube each rank owns; the fifth is the CG iteration cap, which the README
    # fixes at 50 and the program caps again in HPCGMAXITER.  T is that cap's
    # default, not a timestep count -- its comment used to say otherwise and this
    # catalog believed it.
    #
    # The edge is where this row was mis-sized.  A multigrid of four levels
    # halves the edge four times, so m must be a multiple of 16 and 16 is the
    # floor; m is therefore also the granularity, since a rank computes m^3 and
    # exchanges 6m^2 -- the ratio is 6/m.  At the floor the exchange is not
    # covered and the row falls apart at the first node boundary (6.3 s at one
    # node against 32.9 s at two).  At m = 32 it scales monotonically instead:
    # 524.7 / 288.6 / 188.4 / 130.7 s over 1-8 nodes, 4.02x, holding 87-141 GB.
    # The previous cycle read that backwards -- it saw the collapse at m = 16,
    # called the row an anti-scaler, and used the 10-30 s window that judgment
    # implies to keep the edge AT the floor.
    #
    # So this is a strong scaler and is calibrated against ~150 s: the grid and
    # edge above reach it at 155.2 s, 160.9 s and 159.0 s across the three
    # coherence families, holding 125 GB.  The 4096 tiles are 1.19x the largest
    # geometry's 3456 workers -- above the width floor but not by much, and there
    # is no room to raise it: work is tiles x m^3 x maxIter, the iteration count
    # is the benchmark's own and the edge cannot go below 32 without losing the
    # scaling, so more tiles only leave the window.  Granularity wins that trade
    # because without it the row does not scale at all.
    #
    # There is no hinted tier.  A consumer home for the per-exchange halo blocks
    # was written and measured: at m = 16 it is worth 1.09-1.21x and the gain
    # grows with node count, but at m = 32 it is neutral to three digits -- it
    # was mitigating the cost that correct sizing removes outright, not fixing a
    # placement defect.  The application already places well on its own: an
    # unguarded AFFINITY define pins every EDT to its rank's domain and the
    # rank->domain map is a recursive bisection of the 3D grid (getMyPDc), so
    # the domains hold compact boxes.  A reduction tree renumbered into domain
    # order was also tried and lost (1.00x / 0.92x / 0.84x at 2/4/8 nodes).
    # No restructured tier either: the row scales.
    args: ['16', '16', '16', '32', '50']
  hpgmg:
    binary: hpgmg
    class: task
    provenance: 'HPGMG geometric-multigrid benchmark; OCR port by SDSC'
    marker: '\|\|error\|\|'
    scalar_re: '\|\|error\|\|\s*=\s*([\-+0-9.eE]+)'
    tolerance: 0.001
    expect: '0.000000014674034'
    expect_args: ['5', '512']
    # Anti-scaler: the worst cells are the LARGE geometries, so the anchor
    # is sized small (dane1 14.5s, 8n 26.1s; 32n extrapolates ~35-55s).
    # 5 4096 is the ferrari trend size, not the campaign size.
    args: ['5', '512']
    hinted: true
    restructured_as: hpgmg_dist

  hpgmg_dist:
    binary: hpgmg_dist
    class: task
    provenance: 'HPGMG; rank-persistent rewrite (distributed init, sliced spine, face-slab exchange)'
    marker: '\|\|error\|\|'
    scalar_re: '\|\|error\|\|\s*=\s*([\-+0-9.eE]+)'
    tolerance: 0.001
    expect: '0.000000000927790'
    expect_args: ['6', '4096']
    # Scaling app: dane1 anchor ~128s (150s class); the anchor IS the worst
    # cell. Pin verified O(h^2)-consistent (1024^3 = 1/3.985 of the 512^3
    # value) and identical across arms/geometries.
    args: ['6', '4096']
    restructured_from: hpgmg

  LCS_all_db_distributed:
    binary: LCS_all_db_distributed
    class: task
    provenance: 'Longest common subsequence; fully distributed datablocks'
    marker: 'LCS length:'
    scalar_re: 'LCS length:\s*(\d+)'
    scalar_kind: int
    expect: '523'
    expect_args: ['1024', '512', '16']
    args: ['131072', '1024']
    # The hint layer turns this row over.  It bands the block rows across the
    # ranks -- band = (row / height) % nranks -- and re-encodes the labeled
    # index as band + nranks*t so a block's home lands on its band's rank,
    # steering the S tiles the same way so their readers are band-local.  Both
    # tiers create the same 38,746 EDTs; only where they run differs.
    #
    #   nodes   1      2      4      8
    #   base    17.7   33.1   35.0   33.4     anti: 0.53x its own one node
    #   hinted  15.5   13.9   10.1   10.3     strong: 1.52x, and 2.4-3.5x base
    #
    # Judge it on multinode only: at one place nranks is 1, so the re-encoding
    # is the identity and the two tiers are the same program -- they land
    # within 5%, which is what a correct guard looks like.  And judge it on
    # medians: the wavefront's average width is half the grid side, too narrow
    # to fill a 108-worker node, so a single one-node pair swings 15-49 s and
    # says nothing.
    hinted: true
    restructured_as: LCS_wavefront


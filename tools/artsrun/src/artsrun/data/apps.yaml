  npb_cg:
    binary: npb_cg
    class: task
    provenance: 'NAS Parallel Benchmarks CG'
    marker: 'Verification SUCCESSFUL'
    scalar_re: 'Verification SUCCESSFUL \(zeta\s*=\s*([\-+0-9.eE]+)'
    tolerance: 1e-10
    # Fork-join: per matvec, na/blk transient row tasks and one gather whose
    # dependence count IS na/blk.  Anti-scaler -- the whole-vector broadcast,
    # the single-EDT gather and the serial vector spine make every added node
    # cost time -- so the class stays at A (B already times out at two nodes).
    # -b is set by the widest geometry: 7000 tasks per matvec is 2.0x 32 Dane
    # nodes' 3456 workers, and lands the anchor at 25.3s.  4x (-b 1) is
    # reachable but costs 67.2s at one node and grows from there.  The pin is
    # the class's own reference zeta, so it is live at args.
    expect: '17.1721077015265'
    expect_args: ['-t', 'A', '-b', '2']
    args: ['-t', 'A', '-b', '2']
    restructured_as: npb_cg_dist

  npb_cg_dist:
    binary: npb_cg_dist
    class: spmd
    provenance: 'NAS Parallel Benchmarks CG; row-band SPMD rewrite'
    marker: 'Verification SUCCESSFUL'
    scalar_re: 'Verification SUCCESSFUL \(zeta\s*=\s*([\-+0-9.eE]+)'
    tolerance: 1e-10
    # SPMD: one persistent chain per rank, 256 row slices inside it (2.4x a
    # node's workers).  Scaler, and the anchor IS the worst cell (dane1 471s).  D is the
    # largest class that runs: E's 72MB operand puts every gather in DRAM
    # behind a TLB walk and takes >19h at one node, while C is 32.6s.  -i
    # cannot bridge the two -- D reaches the benchmark's own 1e-8 bar only
    # near iteration 85 of its 100 -- so the published count stands and
    # the pin is the class's reference zeta (the run prints it to 4e-13).
    # Every rank replays the draw stream itself, so construction never
    # crosses the wire and init is flat in node count.
    expect: '52.5239203995295'
    expect_args: ['-t', 'D']
    args: ['-t', 'D']
    restructured_from: npb_cg

  nqueens:
    binary: nqueens
    class: task
    provenance: 'N-Queens'
    marker: 'sols:\s*\d+'
    scalar_re: 'sols:\s*(\d+)'
    scalar_kind: int
    # Fork-join enumeration.  rounds is pure repetition -- the shutdown EDT
    # restarts the identical solve -- so it stays 1 and the size carries the
    # weight instead.  The two remaining dials are one plane, not two knobs:
    # cutoff fixes max_set = n - cutoff, hence how many levels spawn at all,
    # and scatter says how many of those levels cross ranks.  Swept at n=20
    # over 8 nodes: the cost tracks the NUMBER of scattered tasks, which is
    # exponential in depth, so scattering every spawning level is right only
    # while that count stays near 1e5 (c13 s8 scatters 28M and costs 540s
    # against the optimum's 284s).  c17 s5 is the fastest cell at 283.6s but
    # leaves only 72k units -- 21 per worker at 32 nodes -- and already shows
    # 1.19x work imbalance at 8; c16 s6 gives 789k units, 1.05x imbalance and
    # 287.2s, so the campaign knowingly pays the 1.3% for 10x the headroom
    # (the band is under 0.1%: s7 saturates to the same run as s6 and read
    # 287.3).  scatter 6 is the smallest value meaning "everything" here --
    # s5 leaves the sequential leaves local and costs 295.1.  Anchor ~289s.
    expect: '39029188884'
    expect_args: ['20', '16', '1', '6']
    args: ['20', '16', '1', '6']
    hinted: true


    provenance: 'attack matrix A9/C7: write ownership dragged across ranks'
    marker: 'RWSTEADY OK '
    scalar_kind: bool
    # 403 readers x 50,000 against 62 writers x 120 spread across ranks: the
    # write right migrates constantly while a large reader set chases it.
    # TARGET: arms that make readers follow a moving owner.
    # Crown: EXCL x RETAIN 1.29 s -- turn amortisation survives spread writers.
    # Notable: the INV trio at 1.4x.
    # Graves: the VAL family 6.7-7.9x -- in e2e terms the migration pain
    # reaches VAL's READERS (owner-chasing plus validation traffic), not only
    # the writers a windowed view singles out; EXCL x PURGE 14.3x.
    args: ['403', '62', '1', '1', '20', '65536', '1', '600000', '0', '0', '0', '1', '1', '0', '0', '0', '50000', '120', '0']
    args_by_nodes:
      8: ['91', '14', '1', '1', '20', '65536', '1', '120000', '0', '0', '0', '1', '1', '0', '0', '0', '50000', '120', '0']

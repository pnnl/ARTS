  Stencil2D_intel_channelEVTs:
    binary: Stencil2D_intel_channelEVTs
    class: spmd
    provenance: '2-D stencil over channel events (Intel OCR app)'
    marker: 'Computed L1 norm'
    scalar_re: 'Computed L1 norm\s*=\s*([\-+0-9.eE]+)'
    tolerance: 1e-06
    # The three arguments are the global tile edge, the rank count and the
    # timestep count.  The rank count is the width (13,824 = 4x the largest
    # geometry's 3,456 workers, the dataflow-DAG rule's slack) and the timestep
    # count is a repetition, so the EDGE carries the calibration -- and it has
    # to stay a multiple of the rank grid's least common multiple or the tiles
    # stop dividing evenly, which leaves rungs 3,456 apart.
    #
    # This row strong-scales (31.1 -> 21.4 -> 11.9 -> 8.9 s over 1..8
    # reduced-geometry ranks, 3.51x), so the edge targets ~150 s: 31,104 runs
    # 134.0 / 127.6 / 154.0 s across the three families at 48.5 GB.  The next
    # rung up, 34,560, overshoots at 162.8 / 171.0 / 155.7 s.  The L1 norm is a
    # property of the stencil rather than of the grid, so the pin does not move
    # with the edge.
    expect: '802.000000000000'
    expect_args: ['31104', '13824', '400']
    args: ['31104', '13824', '400']

  stream:
    binary: stream
    class: spmd
    provenance: 'STREAM memory-bandwidth benchmark (McCalpin)'
    marker: 'Solution Validates'
    # The app validates itself: finalize recomputes the kernel chain
    # analytically and compares EVERY element of every thread's array against
    # it at a relative 1e-13.  A failure prints "Solution FAILED Validation"
    # instead, which this pattern does not match, and a cell whose scalar does
    # not extract fails -- so the pin is "the whole array validated".  a[0]
    # cannot carry that: it is a per-element recurrence with no reduction, so
    # it depends on the sweep count and nothing else (identical at 108M, 324M
    # and 972M elements).  It rides along as an extra scalar.
    scalar_re: 'Solution Validates: all (\d+) elements'
    scalar_kind: int
    extra_scalars:
      a0: 'STREAM_RESULT a\[0\] = ([0-9.eE+-]+)'
    # The width is the sweep rule's, not a performance choice: SPMD, so 1x the
    # persistent units the largest geometry provides -- 32 nodes x 108 workers
    # = 3456 chains.  The row carried 1728, chosen (its own comment said)
    # because a wider run measured worse, which is the one reason the
    # invariance rule does not allow.  The base tier collapses on more than one
    # node, so the window is the anti-scaler's and both tiers run it -- the
    # hint layer is a no-op at one place, so the two share an anchor.
    #
    # DELIBERATE DEVIATION: the SWEEP COUNT carries the calibration here, not
    # the array, which is the reverse of the usual rule.  Two things force it.
    #
    # A CLIFF makes the array unusable as a dial.  Per chain, one array crosses
    # 512 KiB between 65,000 and 66,000 elements, and the anchor goes 14.0 s ->
    # 48.9 s across that single step (three further rungs above it stay at
    # ~50 s), so no array size lands in the window at all -- the rung below the
    # cliff is 14.0 s and the one above is 48.9 s.  Both a core's L2 and the
    # allocator's large-object limit are 512 KiB, so which one it is cannot be
    # told apart here; what is established is the boundary and that resident
    # set FALLS across it, 14.7 GB -> 10.2 GB, which is what an allocation path
    # change looks like rather than a cache effect.
    #
    # And shrinking the array would stop this being a memory benchmark.  Only
    # the workers run at once, so the live set is workers x 3 arrays x the
    # per-chain slice: at this size that clears the last-level cache, and at
    # any size the window could otherwise have used it sits well inside it.
    # The sweep count leaves the working set exactly where it is.
    #
    # 100 sweeps runs 19.7 / 19.9 / 20.3 s across the three families at 20 GB.
    # The validation line counts ELEMENTS, so the pin is untouched by this.
    expect: '836352000'
    expect_args: ['836352000', '3456', '100']
    args: ['836352000', '3456', '100']
    # The source carries a placement layer (OCR_APP_OPTIMIZED_PLACEMENT): the
    # four kernels and the loop driver that re-creates them are pinned to the
    # place their chain already runs on, so a re-created array at least stays
    # where the chain is.  It had never been built -- the CMake entry had no
    # HINTED_PLACEMENT and this row had no hinted flag.
    #
    # Measured, that layer is the difference between running and not: at a
    # reduced size the base tier is 67x its own one-node time at two nodes and
    # 64x the hinted tier at eight.  Budget the base tier's multinode cells
    # accordingly or expect them to time out -- that is the tier doing its job
    # of exhibiting the structure, not a defect to mask.
    hinted: true
    restructured_as: stream_dist

  stream_dist:
    binary: stream_dist
    class: spmd
    provenance: 'STREAM; distributed rewrite'
    marker: 'Solution Validates'
    scalar_re: 'Solution Validates: all (\d+) elements'
    scalar_kind: int
    extra_scalars:
      a0: 'STREAM checksum: a\[0\] = ([0-9.eE+-]+)'
    # The same arguments as the row it re-implements.  The two take the same
    # argv triple and their kernels do the same arithmetic statement for
    # statement -- what differs is only whether a kernel's output array is
    # created fresh or written in place -- so they must print the same
    # validation line, which is the check that they are one application.
    expect: '836352000'
    expect_args: ['836352000', '3456', '1000']
    args: ['836352000', '3456', '1000']
    restructured_from: stream



    binary: CoMD_intel_chandra_tiled
    class: spmd
    provenance: 'CoMD (ExMatEx); Intel OCR port, tiled rank grid'
    marker: 'Final energy'
    scalar_re: 'Final energy\s*:\s*([\-+0-9.eE]+)'
    tolerance: 1e-06
    expect: '-1.166063'
    expect_args: ['-x', '8', '-y', '8', '-z', '8', '-N', '2', '-i', '2', '-j', '2', '-k', '1']
    args: ['-x', '144', '-y', '144', '-z', '144', '-N', '8', '-i', '8', '-j', '4', '-k', '4']

  CoMD_sdsc:
    binary: CoMD_sdsc

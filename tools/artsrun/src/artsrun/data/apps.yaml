  RSBench_intel:
    binary: RSBench_intel
    # Master/Worker over a task-parallel map, the same central-producer
    # batch chain as XSBench_intel (nprocs is hardcoded to 1); the SPMD
    # member of the pair is the sharedDB sibling.
    class: mw
    provenance: 'RSBench multipole cross-section proxy (ANL)'
    marker: 'Lookups:'
    scalar_re: 'RSBench pole checksum:\s+(\d+)'
    scalar_kind: int
    # The pole-data checksum depends on -s/-p/-w/numL only (fixed rand()
    # sequence, no srand anywhere), so the pin survives -l changes.
    expect: '8991421287304279555'
    expect_args: ['-s', 'large', '-l', '150000', '-b', '3456']
    # Same shape and rules as XSBench_intel: central serial production caps
    # the row (~98K lookups/s at 15 workers, LESS at 108 — spawn-limited),
    # multinode is wire-bound (~0.6-0.7K lookups/s at 2 nodes), init is
    # negligible (the exploded plane is only ~3 DBs per nuclide).  -l is
    # sized by the worst cell (hinted val_wb at 8 bentley nodes ≈ 330 s
    # against the 600 s ceiling); -b 3456 is the Master/Worker window rule
    # (cover the largest machine); -s/-p/-w stay at the benchmark's
    # canonical defaults (H-M large, 1000 poles, 100 windows; this port has
    # no nprocs, so -p is the poles flag here — only sharedDB renamed it -a).
    # -s large IS the port's default — named explicitly so the selection is
    # self-documenting, unlike XSBench_intel whose default is small.
    args: ['-s', 'large', '-l', '150000', '-b', '3456']
    hinted: true

  RSBench_intel_sharedDB:
    binary: RSBench_intel_sharedDB
    class: spmd
    provenance: 'RSBench (ANL); shared-datablock form'
    marker: 'Simulation complete\.'
    scalar_re: '(?m)^\s*(?:\[\d+\]\s*)?Lookups:\s*(?:\[\d+\]\s*)?([0-9]+)\s*$'
    scalar_kind: int
    expect: '1000000'
    expect_args: ['-s', 'large', '-l', '1000000', '-t', '108', '-p', '32']
    # The scalar is the workload echo (completion-level), the same convention
    # as XSBench_intel_sharedDB: the app's computed answer (the slow-Faddeeva
    # counters) is delivered through its labeled-GUID reduction-tree library,
    # and that delivery is observably nondeterministic under this runtime's
    # labeled semantics (create replaces) — 17 sweep cells printed 17 distinct
    # sums on identical inputs — so no computed value can be pinned.  The
    # anchored regex skips the startup "XS Lookups:" echo.
    # Strict sweep invariant (same convention as XSBench_intel_sharedDB,
    # same fork-SPMD code family): every logical count is node-invariant —
    # 32 instances, 108 chains each (1x the campaign node's persistent
    # workers), 1,000,000 lookups per instance = a constant 32M aggregate,
    # sized to ~127 s at one 15-worker bentley node (the multipole kernel
    # runs ~250K lookups/s there — two orders below XSBench's).  The
    # fork's block partition maps the 32 instances onto however many PDs
    # the run has.
    args: ['-s', 'large', '-l', '1000000', '-t', '108', '-p', '32']

  sar_pss:
    binary: sar_problem_size_scaling
    class: task
    provenance: 'Streaming Sensor Challenge Problem SAR reference (Georgia Tech Research Institute)'
    marker: 'SAR detects:'
    scalar_re: 'SAR detects:\s*(\d+)'
    scalar_kind: int
    args: ['{repo}/datasets/sar-huge/Data.bin', '{repo}/datasets/sar-huge/PlatformPosition.bin', '{repo}/datasets/sar-huge/PulseTransmissionTime.bin', '{repo}/scratch/sar_detects.txt', '{repo}/third_party/ocr-apps/apps/sar/ocr/problem_size_scaling/Parameter9.txt']
    # Anti-scaler, structurally: every tile family splits the image but writes
    # it back through ONE whole-image block acquired RW, and write permission
    # is exclusive per policy domain, so the block tours the domains and each
    # hop carries the whole image.  Measured at 2000 a side: 13.2s / 1.4GB at
    # one bentley node against 78.7s / 110.5GB at two.
    #
    # No hinted tier: a placement layer here either collapses the pipeline onto
    # one rank (measured: 97% of the useful work on one of four, five tasks
    # between the other two) or, written honestly as a coordinate map, runs
    # 23-36% slower than no hints.  Affinity cannot address a serialisation
    # that is on a shared block.
    #
    # The parameter file IS the size dial: the shipped files differ only in the
    # image grid, by the rule Ix = 400*(n+1), and Parameter9 is the last one
    # they ship.  That puts this row's anchor at 12.2s -- inside the 10-30s an
    # anti-scaler is sized to -- so the grid needs no extension here (the
    # restructured row extends the same ladder for its own).  detects scales
    # with the grid and is deterministic, which is what the pin checks.
    expect: '4075334'
    expect_args: ['{repo}/datasets/sar-huge/Data.bin', '{repo}/datasets/sar-huge/PlatformPosition.bin', '{repo}/datasets/sar-huge/PulseTransmissionTime.bin', '{repo}/scratch/sar_detects.txt', '{repo}/third_party/ocr-apps/apps/sar/ocr/problem_size_scaling/Parameter9.txt']
    fixtures: ['{repo}/datasets/sar-huge/Data.bin', '{repo}/datasets/sar-huge/PlatformPosition.bin', '{repo}/datasets/sar-huge/PulseTransmissionTime.bin']
    restructured_as: sar_dist

  sar_dist:
    binary: sar_dist
    class: task
    provenance: 'Streaming Sensor Challenge Problem SAR reference (Georgia Tech Research Institute); distributed rewrite'
    marker: 'SAR detects:'
    scalar_re: 'SAR detects:\s*(\d+)'
    scalar_kind: int
    # The four shared objects the base program's phases pass through are gone:
    # backprojection writes one block per tile and gathers once; the correlation
    # pass is fused into the detection pass, so the whole-image correlation map
    # is never built; detections are per block instead of appended into one
    # array under an atomic, and each block writes its own slice of the output
    # file at its own offset; and the affine resample lands its tiles straight
    # in the current image, so its whole-image intermediate and the copy that
    # read it both disappear.  It scales where the base anti-scales, which puts
    # it in the ~150 s scaler window rather than the base's 10-30 s -- hence its
    # own rung of the shipped ladder (Ix = 400*(n+1), so 18400 is Parameter45).
    args: ['{repo}/datasets/sar-huge/Data.bin', '{repo}/datasets/sar-huge/PlatformPosition.bin', '{repo}/datasets/sar-huge/PulseTransmissionTime.bin', '{repo}/scratch/sar_detects.txt', '{repo}/third_party/ocr-apps/apps/sar/ocr/problem_size_scaling/Parameter45.txt']
    expect: '27114207'
    expect_args: ['{repo}/datasets/sar-huge/Data.bin', '{repo}/datasets/sar-huge/PlatformPosition.bin', '{repo}/datasets/sar-huge/PulseTransmissionTime.bin', '{repo}/scratch/sar_detects.txt', '{repo}/third_party/ocr-apps/apps/sar/ocr/problem_size_scaling/Parameter45.txt']
    fixtures: ['{repo}/datasets/sar-huge/Data.bin', '{repo}/datasets/sar-huge/PlatformPosition.bin', '{repo}/datasets/sar-huge/PulseTransmissionTime.bin']
    restructured_from: sar_pss

  smithwaterman:
    binary: smithwaterman
    class: task
    provenance: 'Smith-Waterman sequence alignment'
    marker: 'score:\s*\d+'
    scalar_re: 'score:\s*(\d+)'
    scalar_kind: int
    expect: '86360'
    expect_args: ['100', '100', '{repo}/datasets/smithwaterman/string1-cal.txt', '{repo}/datasets/smithwaterman/string2-cal.txt', '{repo}/datasets/smithwaterman/score-cal.txt']
    # Two knobs and they are independent: total DP work is the product of the
    # two sequence lengths, while the wavefront's peak width is min(len)/tile.
    # The tile the app documents is 10, but its example runs a 51-character
    # sequence, so it says nothing about scale; the width rule has to derive it.
    #
    # DELIBERATE DEVIATION on width, and it is structural.  A wavefront needs
    # W^2 tasks to offer width W: the rule's 4x slack (13,824) would be 191 M
    # tasks and even 1x (3,456) is 11.9 M.  This row builds its whole graph in
    # mainEdt -- measured at 9.82 s of a 9.93 s run, against 0.001 s to read
    # the input -- so creation cost tracks the task count and width cannot be
    # bought without leaving the window: tile 100 puts the anchor at 11.8 s
    # with width 0.41x, tile 50 at 100.8 s with width 0.81x.  The window is the
    # binding constraint for an anti-scaler, so the tile stays 100 and the
    # width is given up, with the reason recorded rather than the tile tuned.
    # Both tiers share these arguments and both land in the window: 11.8 s for
    # base and 11.0 s for hinted, each holding 3 GB.
    # (An earlier note blamed 210 GB of tile memory.  That was wrong: the tiles
    # are reclaimed by their consumers.  What accumulated was the readiness
    # events, and those are reclaimed now too.)
    #
    # This row anti-scales steeply -- 1.45 s at one node against 51.3 s at two
    # on the trend size -- and also INSIDE a node, 7.91 s at 15 workers against
    # 10.88 s at 112, which is what a single-threaded creation loop looks like
    # when workers are added around it.
    args: ['100', '100', '{repo}/datasets/smithwaterman/string1-cal.txt', '{repo}/datasets/smithwaterman/string2-cal.txt', '{repo}/datasets/smithwaterman/score-cal.txt']
    fixtures: ['{repo}/datasets/smithwaterman/string1-cal.txt', '{repo}/datasets/smithwaterman/string2-cal.txt', '{repo}/datasets/smithwaterman/score-cal.txt']
    hinted: true
    restructured_as: smithwaterman_dist

  smithwaterman_dist:
    binary: smithwaterman_dist
    class: task
    provenance: 'Smith-Waterman sequence alignment, place-persistent SPMD rewrite'
    marker: 'score:\s*\d+'
    scalar_re: 'score:\s*(\d+)'
    scalar_kind: int
    expect: '493680'
    expect_args: ['100', '100', '{repo}/datasets/smithwaterman/string1-swd.txt', '{repo}/datasets/smithwaterman/string2-swd.txt', '{repo}/datasets/smithwaterman/score-swd.txt', '32']
    # The same wavefront and the same kernel as the row it re-implements; what
    # changes is that each place builds the tasks for its own band of rows
    # instead of one rank prescribing the whole W^2 graph.  That row spends
    # 9.82 s of a 9.93 s run inside mainEdt, so it cannot finish before its
    # creation loops do -- more workers make it slower (7.91 s at 15 against
    # 10.88 s at 112) and more ranks turn every placed task into a message.
    #
    # Rows are banded rather than scattered because a wavefront is a pipeline:
    # only the band's top edge crosses, O(P*W) against the O(W^2) a cyclic map
    # pays, and the fill is P of the 2W-1 anti-diagonal steps, under a percent
    # here.  Measured, cyclic was worse than the base row's own hinted banding.
    #
    # Names are created in a phase of their own, before the phase that binds
    # to them: a band's builder waits on the announcements of its own names
    # and of the band above, which is every name its tasks can reach.  A
    # chain that made each band wait for the whole band above instead is
    # portable too, but it serialises creation and the row stops scaling
    # (0.95x against 6.19x over 1..8 nodes, same input, interleaved).
    #
    # This row is a SCALER, so it is calibrated against ~150 s.  ds comes from
    # the window (the anchor goes as L^2.2: 7.9 s at 200k, 40.1 s at 400k,
    # 92.7 s at 600k, 178.5 s at 800k) and the tile then sets the width.
    # The anchor is the tightest of the three coherence arms; at 800,000 they
    # run 178.5 / 163.6 / 155.6 s holding 106 / 88 / 106 GB, so the window
    # decides the size and the node's memory has room to spare.
    #
    # places is the ownership decomposition, not the width knob: the width is
    # the tile grid, and 800,000 at tile 100 is 6.4e7 tiles against the 13,824
    # a 4x-slack DAG rule asks for.  places follows the SPMD rule instead --
    # one persistent unit per node, each owning a partition -- fixed at the
    # largest geometry (32) and packed by placeRank at smaller node counts, so
    # the decomposition does not move with the sweep.  It is not a performance
    # choice: at one node the fastest value is 4 (12.9 s), not 32 (14.4 s).
    #
    # DELIBERATE DEVIATION on width, structural and smaller than the base
    # row's.  A wavefront needs W^2 tasks for width W, and distributing the
    # creation does not reduce the count: at 800,000 a tile of 50 quadruples
    # the tiles and passed 417 GB before it was stopped, against tile 100's
    # 106 GB -- past what a node has.  The tile stays 100 and the row runs at
    # 6.19x -- against the base row's 0.41x, which is the width this tier
    # actually bought.
    #
    # The answer is pinned by agreement between two independently built graphs
    # (this row and the port it re-implements) rather than by a sequential
    # reference: 800,000 x 800,000 is 6.4e11 cells.
    args: ['100', '100', '{repo}/datasets/smithwaterman/string1-swd.txt', '{repo}/datasets/smithwaterman/string2-swd.txt', '{repo}/datasets/smithwaterman/score-swd.txt', '32']
    fixtures: ['{repo}/datasets/smithwaterman/string1-swd.txt', '{repo}/datasets/smithwaterman/string2-swd.txt', '{repo}/datasets/smithwaterman/score-swd.txt']
    restructured_from: smithwaterman


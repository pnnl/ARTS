    # TARGET: it is the control for the fast churn column -- the dial that
    # shows how much of a protocol's verdict is churn rate rather than shape.
    # Crown: INV x WB 2.40 s; VAL x WB only 1.4x behind, where the fast end of
    # the same dial puts it 8x behind -- the version-floor dedup answers most
    # redirects header-only once copies live 20 ms.
    # Grave: EXCL x PURGE 19.2x (the read-side purge tax at 16 MB).
    args: ['465', '1', '1', '1', '20', '16777216', '1', '600000', '0', '0', '1', '1', '1', '0', '0', '0', '5000', '100', '20000']
    args_by_nodes:
      8: ['105', '1', '1', '1', '20', '16777216', '1', '120000', '0', '0', '1', '1', '1', '0', '0', '0', '5000', '100', '20000']
    default_enabled: false

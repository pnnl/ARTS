  # A note on T_MS across these rows: it is a BUDGET GUARD, not the workload.
  # Termination is the per-chain op count, and a chain that hits the deadline
  # short of its count withholds the completion marker (CAP-HIT), failing the
  # cell.  The Dane editions keep ferrari's ops per chain while the chain count
  # rises with the node count, so the JOB is ~4.4x ferrari's while the guard was
  # left at ferrari's 180 s.  Extrapolating the measured EXCL x PURGE graves
  # puts the bomb near 355 s and the slow dial near 204 s, both past it.  The
  # guard is raised rather than the op counts lowered: halving ops would make
  # these a different job from the ferrari columns they are compared against,
  # and the classes terminate independently, so cutting the writer's count
  # turns a mixed column into a read mill.
  # --- the adversarial suite ------------------------------------------------
  # Twelve attacks, each a program plus ONE designed workload, so a column of
  # the master table is a row here rather than a point buried in a sweep file.
  # Every one names its target: the suite's claim is that each arm of the plane
  # is somebody's optimum and somebody's disaster, so a column exists to crown
  # one arm or bury another, and the ratios below are the measured verdicts.
  # The arguments are the Dane geometry (rwpriv at 8 nodes, rwsteady at 32);
  # `args_by_nodes` carries the reduced-geometry edition where one was run.
  # Chains scale with the machine at ~15 a rank, which is what keeps a job the
  # same job across geometries.
  own_reread_64k:
    binary: rwpriv
    class: mw
    kind: attack
    provenance: 'attack matrix C1: private-lane re-read (release-axis spectrometer)'
    marker: 'RWPRIV OK '
    scalar_kind: bool
    # 96 chains re-reading the block they own, 22,000 ops each at 64 KB, so
    # nothing is shared and the only cost left is what a protocol charges a
    # holder for touching its own data again.
    # TARGET: the two arms that cannot let a holder keep anything.
    # Crowns: six arms tie at a 0.53 s floor -- they charge re-use nothing.
    # Graves: EXCL x PURGE 27 s (51x; it hands the block back at every zero
    # edge and re-fetches the bytes), VAL x WT x PURGE 8.8 s (17x; the
    # validation certificate survives even with no sharer to validate against).
    args: ['96', '0', '1', '1', '20', '65536', '120000', '0', '1', '0', '0', '1', '22000', '0']
    default_enabled: false
    timeout: 900
    multinode_timeout: 900
  own_reread_16m:
    binary: rwpriv
    class: mw
    kind: attack
    provenance: 'attack matrix C1: private-lane re-read at size'
    marker: 'RWPRIV OK '
    scalar_kind: bool
    # The same private re-read with the payload 256x larger, which converts a
    # protocol's per-turn byte traffic into the dominant term.
    # TARGET: purge-family arms, whose return-and-refetch now moves 16 MB.
    # Crowns: the floor again -- size costs a retaining arm nothing.
    # Grave: EXCL x PURGE 26.7 s (35x).
    args: ['96', '0', '1', '1', '20', '16777216', '180000', '0', '1', '0', '0', '1', '250', '0']
    default_enabled: false
    timeout: 900
    multinode_timeout: 900
  own_rewrite_64k:
    binary: rwpriv
    class: mw
    kind: attack
    provenance: 'attack matrix C1: private-lane re-write (turn amortization)'
    marker: 'RWPRIV OK '
    scalar_kind: bool
    # 96 chains re-writing their OWN block, 15,000 ops each: consecutive write
    # turns by one holder, which a sticky grant should make free.
    # TARGET: every arm that re-arbitrates a write it already owns.
    # Crowns: VAL x WB and EXCL x RETAIN at 0.37 s -- the grant outlives the
    # writer, so the second turn costs nothing.
    # Notable: INV x WB 5.9 s (16x) -- a flat invalidation round per release,
    # 15,000 x 352 us, even with no sharer to invalidate.
    # Graves: the WT family 16 s (43x, payload home at every release), the WT
    # purge twins 25 s (68x), EXCL x PURGE 27 s (74x).
    args: ['0', '96', '1', '1', '20', '65536', '120000', '0', '1', '0', '0', '1', '0', '15000']
    default_enabled: false
    timeout: 900
    multinode_timeout: 900
  own_rewrite_16m:
    binary: rwpriv
    class: mw
    kind: attack
    provenance: 'attack matrix C1: private-lane re-write at size'
    marker: 'RWPRIV OK '
    scalar_kind: bool
    # The re-write turn with a 16 MB payload: the same arbitration, but every
    # write-through publish now carries the block.
    # TARGET: write-through, whose per-release publish is size-proportional.
    # Crowns: a 0.76-0.98 s trio (the retaining write-back arms).
    # Graves: the same classes as the 64K lane at 21x / 31x / 36x.
    args: ['0', '96', '1', '1', '20', '16777216', '180000', '0', '1', '0', '0', '1', '0', '160']
    default_enabled: false
    timeout: 900
    multinode_timeout: 900
  one_home_funnel_4m:
    binary: rwsteady
    class: mw
    kind: attack
    provenance: 'attack matrix C2: many readers funnelled through one home'
    marker: 'RWSTEADY OK '
    scalar_kind: bool
    # Every reader pulls from 16 blocks that all live on one rank (HSPREAD=1),
    # 300 ops each at 4 MB: a read-only funnel with no writer at all.
    # TARGET: arms that must ask the home again for a copy they already hold.
    # Crowns: INV and EXCL x RETAIN at 0.23 s -- a durable copy answers locally.
    # Grave: EXCL x PURGE 26.4 s (116x) -- it returns the copy at every zero
    # edge, so the funnel is re-served from one rank for every op.
    args: ['465', '0', '1', '1', '20', '4194304', '16', '600000', '0', '0', '0', '1', '1', '0', '0', '0', '300', '0', '0']
    args_by_nodes:
      8: ['105', '0', '1', '1', '20', '4194304', '16', '120000', '0', '0', '0', '1', '1', '0', '0', '0', '300', '0']
    default_enabled: false
    timeout: 900
    multinode_timeout: 900
  audienceless_publish_16m:
    binary: rwsteady
    class: mw
    kind: attack
    provenance: 'attack matrix C8: writes nobody reads'
    marker: 'RWSTEADY OK '
    scalar_kind: bool
    # 15 writers, 2,500 writes each at 16 MB, and NO readers: every byte a
    # protocol moves here is waste, because the audience it moves them for does
    # not exist.  The geometry is deliberate and narrow -- WSPREAD=1 confines
    # every writer to ONE policy domain and D=1 gives them ONE block, so
    # same-domain RW concurrency (legal by contract) carries the writes and no
    # cross-node contention enters.
    # TARGET: write-through, which publishes to the home whether or not anyone
    # will read it.
    # Crowns: VAL x WB and EXCL x RETAIN at 0.18 s, INV x WB 0.28 s -- the
    # payload stays with the writer.
    # Graves: the WT trio at 137-144x, EXCL x PURGE 79x.
    # DO NOT widen the writer count: publishes coalesce per (block, rank) and
    # the grant's zero edge grows rarer, so more writers means FEWER publishes
    # per write -- the column would stop measuring a publish per write.
    args: ['0', '15', '1', '1', '20', '16777216', '1', '600000', '0', '0', '1', '1', '1', '0', '0', '0', '0', '2500', '0']
    args_by_nodes:
      8: ['0', '15', '1', '1', '20', '16777216', '1', '90000', '0', '0', '1', '1', '1', '0', '0', '0', '0', '2500']
    default_enabled: false
    timeout: 900
    multinode_timeout: 900
  freerun_read_heavy_64k:
    binary: rwsteady
    class: mw
    kind: attack
    provenance: 'attack matrix C9: uncoupled read-heavy mix'
    marker: 'RWSTEADY OK '
    scalar_kind: bool
    # 406 readers x 40,000 and 59 writers x 5,000 on a shared 64 KB block, all
    # free-running: the ordinary steady state a cache is designed for, with
    # reuse high enough that keeping a copy should pay.
    # TARGET: arms with no durable reader copy.
    # Crowns: the INV trio at 7.7-8.4 s -- a covering read is a pure load.
    # Graves: EXCL x PURGE 22 s (2.9x); VAL pays 13-14 s to re-validate.
    args: ['406', '59', '1', '1', '20', '65536', '1', '600000', '0', '0', '0', '1', '1', '0', '0', '0', '40000', '5000', '0']
    args_by_nodes:
      8: ['92', '13', '1', '1', '20', '65536', '1', '120000', '0', '0', '0', '1', '1', '0', '0', '0', '40000', '5000']
    default_enabled: false
    timeout: 900
    multinode_timeout: 900
  pipeline_converge_1m:
    binary: rwsteady
    class: mw
    kind: attack
    provenance: 'attack matrix C10: coupled producer-consumer pipeline'
    marker: 'RWSTEADY OK '
    scalar_kind: bool
    # PIPE=1 couples the classes: 62 producers publish versions of 31 blocks
    # and 403 consumers run until they have seen the final one, so a consumer
    # cannot outrun its producer and every handoff is on the critical path.
    # TARGET: arms whose handoff needs a round trip before the reader may look.
    # Crown: VAL x WB 0.09 s -- a consumer validates and reads the producer's
    # own copy.
    # Graves: the INV x WT twins 19 s (224x -- an invalidation round stands

# Application catalog: what each benchmark structurally is.
#
# Committed values are the ones that describe the application itself —
# its binary, how a completed run announces itself, how its result scalar
# is read, which versions exist, and the structural reasons a cell cannot
# run.  `args` is the calibrated strong-scaling workload and is the only
# field a benchset routinely overrides.
#
# `kind` separates what the program is from whether a campaign runs it. An
# application is one a field cites by name (graph500, HPCG, CoMD, XSBench,
# STREAM); a microbenchmark is named after an operation (globalsum, reduction,
# dbcreate) or after nothing, and probes one runtime mechanism. Upstream's own
# layout decides most of it: apps/kernels/ and apps/examples/ are
# microbenchmarks, apps/<name>/ is an application.
#
# Versions: every application has `base` (as published, plus the disclosed
# structure-preserving conformance adaptations).  `hinted` exists where the
# source carries a placement hint layer (built as <binary>_hinted), and
# `restructured` where the task/data decomposition was redesigned and
# registered as its own target — the answer to a scaling problem that
# placement hints alone could not fix.

apps:
  basicIO:
    binary: basicIO
    class: task
    provenance: 'OCR file-input fixture'
    kind: microbench
    marker: 'BASICIO_CHK'
    scalar_re: 'BASICIO_CHK\s+(\d+)'
    scalar_kind: int
    expect: '1'
    expect_args: ['0', '10', '{repo}/datasets/basicIO/basicIO_test.dat']
    args: ['0', '10', '{repo}/datasets/basicIO/basicIO_test.dat']
    fixtures: ['{repo}/datasets/basicIO/basicIO_test.dat']
    default_enabled: false

  cache_offset:
    binary: cache_offset
    class: task
    provenance: 'OCR datablock cache-offset probe'
    kind: microbench
    marker: 'CACHE_OFFSET_CHK'
    scalar_re: 'CACHE_OFFSET_CHK\s+(\d+)'
    scalar_kind: int
    expect: '17592181850112'
    expect_args: []
    args: []
    default_enabled: false

  cholesky:
    binary: cholesky
    class: task
    provenance: 'Tiled Cholesky factorization'
    marker: 'CHOLESKY trace'
    scalar_re: 'CHOLESKY trace\s*=\s*([0-9.eE+-]+)'
    tolerance: 1e-09
    expect: '50'
    expect_args: ['--ds', '50', '--ts', '10', '--fi', '{repo}/datasets/cholesky/cholesky_input.mat']
    # Perf input rides the tile-stream binary: parsing 25M text numbers is an
    # arm-neutral constant, but it still pads every cell's absolute time.
    # The tile size is part of the stream layout, hence part of the name.
    args: ['--ds', '5000', '--ts', '100', '--fib', '{repo}/datasets/cholesky/cholesky_perf5k_ts100.bin']
    fixtures: ['{repo}/datasets/cholesky/cholesky_input.mat', '{repo}/datasets/cholesky/cholesky_perf5k_ts100.bin']
    hinted: true

  cholesky_blas:
    binary: cholesky_blas
    class: task
    provenance: 'Tiled Cholesky factorization over BLAS'
    marker: 'CHOLESKY trace'
    scalar_re: 'CHOLESKY trace\s*=\s*([0-9.eE+-]+)'
    tolerance: 1e-09
    # The BLAS port has no tile-stream reader (separate source); it stays on
    # the text path.
    args: ['--ds', '7500', '--ts', '100', '--fi', '{repo}/datasets/cholesky/cholesky_perf7k5.mat']
    fixtures: ['{repo}/datasets/cholesky/cholesky_perf7k5.mat']
    hinted: true

  CoMD_intel_chandra:
    binary: CoMD_intel_chandra
    class: task
    provenance: 'CoMD (ExMatEx); Intel OCR port'
    # Atom migration mutates two cells through EW dependences, whose
    # exclusive-write guarantee this runtime maps onto per-node RW; the
    # sibling ports cover the same physics (CoMD_sdsc serial-redistribute,
    # CoMD_intel_chandra_tiled message-passing) without needing EW.
    unsupported: 'needs exclusive-write (EW) semantics the runtime does not implement'
    default_enabled: false
    marker: 'Initial energy'
    scalar_re: 'Initial energy\s*:\s*([\-+0-9.eE]+)'
    tolerance: 0.0001
    # The port reaches its wrap-up only through the kinetic-energy reduction,
    # which runs on print-period boundaries — a step count the period does
    # not divide never terminates.  The args keep -n dividing -N for that
    # reason (the row is disabled regardless; see unsupported above).
    args: ['-x', '60', '-y', '60', '-z', '60', '-N', '6', '-n', '6']

  CoMD_intel_chandra_tiled:
    binary: CoMD_intel_chandra_tiled
    class: spmd
    provenance: 'CoMD (ExMatEx); Intel OCR port, tiled rank grid'
    marker: 'Final energy'
    scalar_re: 'Final energy\s*:\s*([\-+0-9.eE]+)'
    tolerance: 1e-06
    # Scaling-app anchor: -N 100 (the benchmark's own default) lands the
    # dane1 cell (one 108w+4p node) at ~126 s, inside the ~150 s anchor
    # band; the 24x12x12 rank grid is 3456 = one persistent chain per
    # worker at the largest campaign geometry, node-invariant.
    expect: '-1.166049797578'
    expect_args: ['-x', '216', '-y', '216', '-z', '216', '-N', '100', '-n', '10', '-i', '24', '-j', '12', '-k', '12']
    args: ['-x', '216', '-y', '216', '-z', '216', '-N', '100', '-n', '10', '-i', '24', '-j', '12', '-k', '12']

  CoMD_sdsc:
    binary: CoMD_sdsc
    class: task
    provenance: 'CoMD molecular-dynamics proxy (ExMatEx); OCR port by SDSC'
    marker: 'Final energy'
    scalar_re: 'Final energy\s*:\s*([\-+0-9.eE]+)'
    tolerance: 1e-06
    # Anti-scaling anchor: each step re-wires a 24,389-box five-phase
    # fork-join over the wire, so the LONGEST cell is the LARGEST geometry
    # and -N (the duration knob; per-step structure is the invariant) is
    # sized by the 32-node budget, not by 1n -- measured per-step wall
    # 12.4/19.2/25.5 s at 2/4/8 bentley nodes (~+6.5 s per doubling)
    # extrapolates to ~38 s/step at 32n, so -N 15 puts the worst cell
    # near the 600 s budget (1n is then ~12 s: correct for this class).
    # The period must divide -N or the final print's kinetic term is
    # stale.  Re-check the 32n extrapolation on Dane's fabric.
    expect: '-1.166054974646'
    expect_args: ['-x', '48', '-y', '48', '-z', '48', '-N', '15', '-n', '5']
    args: ['-x', '48', '-y', '48', '-z', '48', '-N', '15', '-n', '5']
    hinted: true

  CoMD_sdsc2:
    binary: CoMD_sdsc2
    class: task
    provenance: 'CoMD (ExMatEx); OCR port by SDSC (P. Cicotti)'
    # Same EW dependence as CoMD_intel_chandra: per-cell atom migration
    # needs one-EDT-at-a-time exclusivity the runtime does not provide.
    unsupported: 'needs exclusive-write (EW) semantics the runtime does not implement'
    default_enabled: false
    marker: 'Final energy'
    scalar_re: 'Final energy\s*:\s*([\-+0-9.eE]+)'
    tolerance: 0.0001
    expect: '-1.166063027842'
    expect_args: ['-x', '4', '-y', '4', '-z', '4', '-N', '2']
    args: ['-x', '44', '-y', '44', '-z', '44', '-N', '8']

  curvefit:
    binary: curvefit
    class: task
    provenance: 'OCR adaptive piecewise-linear fit demo (reports no result)'
    kind: microbench
    marker: 'SUCCESS'
    scalar_kind: bool
    args: ['48', '0.01', '0.5', '1000000']
    default_enabled: false

  dbcreate_matrix:
    binary: dbcreate_matrix
    class: task
    provenance: 'Datablock-creation probe written for this driver'
    kind: microbench
    marker: 'CELLS_OK='
    scalar_re: 'CELLS_OK=(\d+)/12'
    scalar_kind: int
    args: []
    default_enabled: false

  dbctrl:
    binary: dbctrl
    class: task
    provenance: 'OCR datablock lifecycle kernel'
    kind: microbench
    marker: 'Total time'
    scalar_kind: bool
    args: ['6', '6', '1024']
    default_enabled: false

  fft:
    binary: fft
    class: task
    provenance: 'FFT, recursive form'
    marker: 'FFT checksum'
    scalar_re: 'FFT checksum\s*=\s*([\-+0-9.eE]+)'
    tolerance: 0.001
    expect: '81.421870'
    expect_args: ['6']
    args: ['23']
    # restructured_as: fft_dist   # held back — see the entry below

  # Held back with the target: the program's source is not carried by the
  # application submodule yet, so the build has no target for it.  Restore
  # this entry, and its parent's restructured_as, with the registration in
  # benchmarks/apps/CMakeLists.txt once the submodule carries the source.
  #fft_dist:
  #binary: fft_dist
  #class: task
  #provenance: 'FFT, Bailey four-step transpose rewrite'
  #marker: 'FFT_DIST checksum'
  #scalar_re: 'FFT_DIST checksum\s*=\s*([\-+0-9.eE]+)'
  #tolerance: 0.001
  #expect: '4194304.0'
  #expect_args: ['22']
  #args: ['28', '512']
  #restructured_from: fft

  fibonacci:
    binary: fibonacci
    class: task
    provenance: 'Fibonacci recursion'
    marker: 'answer is\s*\d+'
    scalar_re: 'answer is\s*(\d+)'
    scalar_kind: int
    # Fork-join recursion with no data: the tree IS the decomposition, so the
    # only dials are the size and how deep the spawn scatters before subtrees
    # pin to the rank they landed on.  41 puts the anchor at 173.4s; scatter
    # 11 gives 2048 distinct paths, ample for 32 nodes, and sits on the
    # measured plateau (9-14 within 3% at 4 and 8 nodes).
    expect: '165580141'
    expect_args: ['41', '11']
    args: ['41', '11']
    hinted: true

  globalsum_cgNoShim:
    binary: globalsum_cgNoShim
    class: task
    provenance: 'OCR global-sum implementation, CG driver without shim'
    kind: microbench
    marker: 'CG0 T\d+\s+0 value'
    scalar_re: 'CG0 T100\s+0 value\s+([0-9.]+)'
    tolerance: 1e-05
    expect: '0.462231'
    expect_args: []
    args: []
    default_enabled: false

  globalsum_cgShim:
    binary: globalsum_cgShim
    class: task
    provenance: 'OCR global-sum implementation, CG driver with shim'
    kind: microbench
    marker: 'CG0 T\d+\s+0 value'
    scalar_re: 'CG0 T\d+\s+0 value\s+([0-9.]+)'
    tolerance: 1e-05
    expect: '0.462231'
    expect_args: []
    args: []
    default_enabled: false

  globalsum_pcg:
    binary: globalsum_pcg
    class: task
    provenance: 'OCR global-sum implementation, preconditioned CG driver'
    kind: microbench
    marker: 'CG0 T\d+\s+0 value'
    scalar_re: 'CG0 T\d+\s+0 value\s+([0-9.]+)'
    tolerance: 1e-05
    expect: '0.999794'
    expect_args: []
    args: []
    default_enabled: false

  graph500:
    binary: graph500
    class: task
    provenance: 'Graph500 BFS benchmark'
    marker: 'nodes \d+'
    scalar_re: 'nodes (\d+)'
    scalar_kind: int
    expect: '64'
    expect_args: ['6', '8', '1', '1']
    args: ['20', '8', '32', '16']
    extra_scalars:
      kernel2_ns: '\[kernel2 time ([0-9.eE+-]+)\]'
      mteps: 'mean MTEPS ([0-9.eE+-]+)'

  highbw:
    binary: highbw
    class: mw
    provenance: 'OCR high-bandwidth example'
    kind: microbench
    marker: 'HIGHBW_WORK_SUM'
    scalar_re: 'HIGHBW_WORK_SUM\s*=\s*(\d+)'
    scalar_kind: int
    expect: '2048'
    expect_args: []
    args: ['48', '8388608', '1000']
    default_enabled: false

  hpcg_intel:
    binary: hpcg_intel
    class: spmd
    provenance: 'HPCG conjugate-gradient benchmark'
    marker: 'final deviation'
    scalar_re: 'final deviation:\s*([\-+0-9.eE]+)'
    tolerance: 0.0001
    expect: '0.001279'
    expect_args: ['1', '1', '1', '16', '5']
    args: ['8', '4', '4', '64', '10']

  hpcg_intel_Eager:
    binary: hpcg_intel_Eager
    class: spmd
    provenance: 'HPCG; eager-datablock reduction variant'
    marker: 'final deviation'
    scalar_re: 'final deviation:\s*([\-+0-9.eE]+)'
    tolerance: 0.0001
    expect: '0.001279'
    expect_args: ['1', '1', '1', '16', '5']
    args: ['4', '4', '3', '64', '15']
    default_enabled: false

  hpcg_intel_Eager_Collective:
    binary: hpcg_intel_Eager_Collective
    class: spmd
    provenance: 'HPCG; runtime collective-event reduction variant'
    marker: 'final deviation'
    scalar_re: 'final deviation:\s*([\-+0-9.eE]+)'
    tolerance: 0.0001
    expect: '0.001279'
    expect_args: ['1', '1', '1', '16', '5']
    args: ['8', '4', '4', '64', '10']

  hpgmg:
    binary: hpgmg
    class: task
    provenance: 'HPGMG geometric-multigrid benchmark; OCR port by SDSC'
    marker: '\|\|error\|\|'
    scalar_re: '\|\|error\|\|\s*=\s*([\-+0-9.eE]+)'
    tolerance: 0.001
    expect: '0.000000014674034'
    expect_args: ['5', '512']
    # Anti-scaler: the worst cells are the LARGE geometries, so the anchor
    # is sized small (dane1 14.5s, 8n 26.1s; 32n extrapolates ~35-55s).
    # 5 4096 is the bentley trend size, not the campaign size.
    args: ['5', '512']
    hinted: true
    restructured_as: hpgmg_dist

  hpgmg_dist:
    binary: hpgmg_dist
    class: task
    provenance: 'HPGMG; rank-persistent rewrite (distributed init, sliced spine, face-slab exchange)'
    marker: '\|\|error\|\|'
    scalar_re: '\|\|error\|\|\s*=\s*([\-+0-9.eE]+)'
    tolerance: 0.001
    expect: '0.000000000927790'
    expect_args: ['6', '4096']
    # Scaling app: dane1 anchor ~128s (150s class); the anchor IS the worst
    # cell. Pin verified O(h^2)-consistent (1024^3 = 1/3.985 of the 512^3
    # value) and identical across arms/geometries.
    args: ['6', '4096']
    restructured_from: hpgmg

  LCS_all_db_distributed:
    binary: LCS_all_db_distributed
    class: task
    provenance: 'Longest common subsequence; fully distributed datablocks'
    marker: 'LCS length:'
    scalar_re: 'LCS length:\s*(\d+)'
    scalar_kind: int
    expect: '523'
    expect_args: ['1024', '512', '16']
    args: ['131072', '1024']
    hinted: true
    restructured_as: LCS_wavefront

  LCS_wavefront:
    binary: LCS_wavefront
    class: task
    provenance: 'LCS; wavefront rewrite (boundary strips on counted events)'
    marker: 'LCS length:'
    scalar_re: 'LCS length:\s*(\d+)'
    scalar_kind: int
    expect: '890574'
    expect_args: ['1769472', '256']
    # L = N/base = 6912: the average anti-diagonal width (L/2 = 3456) matches
    # the largest campaign geometry's total worker count, and the point sits
    # nearest the ~150 s single-node anchor (141.0 s at 108 workers).
    args: ['1769472', '256']
    restructured_from: LCS_all_db_distributed

  LCS_distributed_ST:
    binary: LCS_distributed_ST
    class: task
    provenance: 'Longest common subsequence; labeled-GUID string storage'
    marker: 'LCS length:'
    scalar_re: 'LCS length:\s*(-?\d+)'
    scalar_kind: int
    expect: '131072'
    expect_args: ['131072', '1024']
    # The three tiled LCS rows share one workload so the decomposition ladder
    # is comparable cell by cell.  ~150 s is a SCALING row's anchor; these
    # rows exist to show their curves, so the size is what keeps the worst
    # 32-node cell under the ceiling (and the eager fully-tiled table on one
    # node) — the multinode growth supplies the rest of the plot.
    args: ['131072', '1024']

  LCS_shared:
    binary: LCS_shared
    class: task
    provenance: 'Longest common subsequence; shared datablocks'
    marker: 'LCS length:'
    scalar_re: 'LCS length:\s*(-?\d+)'
    scalar_kind: int
    expect: '131072'
    expect_args: ['131072', '1024']
    # The three tiled LCS rows share one workload so the decomposition ladder
    # is comparable cell by cell.  ~150 s is a SCALING row's anchor; these
    # rows exist to show their curves, so the size is what keeps the worst
    # 32-node cell under the ceiling (and the eager fully-tiled table on one
    # node) — the multinode growth supplies the rest of the plot.
    args: ['131072', '1024']

  # Reclassified 2026-08-23: its EDT set is a strict subset of
  # miniAMR_intel_bryan's (the same block chain with halo send and receive,
  # minus the checksum, reduction and wrap-up path), so it computes no
  # result at all -- what it exercises is the refinement spawn storm.
  miniAMR_forkbomb:
    binary: miniAMR_forkbomb
    kind: microbench
    class: task
    provenance: 'miniAMR (Mantevo); spawn-storm variant'
    marker: 'BLOCK 0 finished'
    scalar_kind: bool
    args: ['--nx', '1', '--ny', '1', '--nz', '1', '--num_tsteps', '1200000', '--num_refine', '2']
    default_enabled: false

  miniAMR_intel:
    binary: miniAMR_intel
    class: task
    provenance: 'miniAMR adaptive-mesh proxy (Mantevo); Intel OCR port'
    marker: 'Grand Total Checksum'
    scalar_re: 'Grand Total Checksum\s*==\s*([\-+0-9.eE]+)'
    tolerance: 1e-08
    expect: '144913203200.000000'
    expect_args: ['--nx', '16', '--ny', '16', '--nz', '16', '--npx', '8', '--npy', '8', '--npz', '8', '--num_tsteps', '360', '--num_objects', '1']
    args: ['--nx', '16', '--ny', '16', '--nz', '16', '--npx', '8', '--npy', '8', '--npz', '8', '--num_tsteps', '360', '--num_objects', '1']
    hinted: true

  # Reclassified 2026-08-23: same philosophy as miniAMR_intel (block-per-EDT
  # dataflow with halo exchange) and dominated by it -- 9 EDT creation sites
  # against 21, no refinement clone machinery, every EDT pinned to the
  # creating rank so nothing distributes, and per-block checksums with no
  # grand total to pin.  Kept as a microbench of the caller-pinned shape.
  miniAMR_intel_bryan:
    binary: miniAMR_intel_bryan
    kind: microbench
    class: task
    provenance: 'miniAMR (Mantevo); full refinement and communication'
    marker: 'miniAMR complete'
    scalar_kind: bool
    args: ['--npx', '4', '--npy', '2', '--npz', '2', '--max_time', '800']

  miniAMR_intel_chandra:
    binary: miniAMR_intel_chandra
    class: spmd
    provenance: 'miniAMR (Mantevo); SPMD rank-grid port'
    marker: 'Done'
    scalar_re: 'ts 2 CHECKSUM sum\s+([\-+0-9.eE]+)'
    tolerance: 1e-06
    # The scalar line (`ts 2 CHECKSUM sum`) is printed only when
    # --report_diffusion is on AND the timestep is a checksum step
    # (ts % checksum_freq == 0) — without these two flags the cell can never
    # match its own scalar_re.
    # SPMD, and the base already carries a complete placement layer: the rank
    # grid maps to policy domains as 3-D subgrids (not modulo) and both EDT and
    # datablock affinity are pinned to the owning domain at 84 sites, so there
    # is no hinted tier to add -- measured 98.8% local acquires and 1.00x EDT
    # spread across ranks at 8 nodes.
    #
    # The rank grid now mirrors the largest geometry (4*4*2 = 32) instead of
    # 12^3 = 1728.  The EDT count is set by the block total, not the rank count
    # (518,117,863 against 518,119,559), so the oversized grid bought nothing
    # and cost 189.4s against 143.3s at the anchor.  Blocks per rank rise to
    # keep the mesh identical, which is why the pin does not move.
    #
    # stages_per_ts and num_vars are stated rather than left at their defaults
    # (20 and 40, the values in force): with the 26-neighbour halo they are
    # what makes 2,082 EDTs per block-timestep, and an argument list that does
    # not name them hides where half a billion EDTs come from.
    expect: '23887872.000000'
    expect_args: ['--npx', '4', '--npy', '4', '--npz', '2', '--init_x', '6', '--init_y', '6', '--init_z', '12', '--nx', '12', '--ny', '12', '--nz', '12', '--num_tsteps', '18', '--num_refine', '0', '--stages_per_ts', '20', '--num_vars', '40', '--report_diffusion', '1', '--checksum_freq', '2']
    args: ['--npx', '4', '--npy', '4', '--npz', '2', '--init_x', '6', '--init_y', '6', '--init_z', '12', '--nx', '12', '--ny', '12', '--nz', '12', '--num_tsteps', '18', '--num_refine', '0', '--stages_per_ts', '20', '--num_vars', '40', '--report_diffusion', '1', '--checksum_freq', '2']

  multigen:
    binary: multigen
    class: task
    provenance: 'OCR multi-generation EDT example'
    kind: microbench
    marker: 'End leaf1, result'
    scalar_re: 'End leaf1, result\s*=\s*(-?\d+)'
    scalar_kind: int
    expect: '121393'
    expect_args: []
    args: []
    default_enabled: false

  multigen_2:
    binary: multigen_2
    class: task
    provenance: 'OCR multi-generation EDT example, second form'
    kind: microbench
    marker: 'End leaf1, result'
    scalar_re: 'End leaf1, result\s*=\s*(-?\d+)'
    scalar_kind: int
    expect: '3524578'
    expect_args: []
    args: []
    default_enabled: false

  nekbone:
    binary: nekbone
    class: spmd
    provenance: 'Nekbone (Nek5000 proxy)'
    marker: 'FinalEDT'
    # The final residual is the one printed value that observes the CG loop
    # (matvec, halo, reductions); the initial residual is computed before it
    # and stays as a secondary scalar.
    scalar_re: 'CGloop_stop> rnormfinal(?:\^2)?\s*=\s*([0-9.eE+-]+)'
    # artsrun uses the tolerance as an absolute floor as well as a relative
    # one, so it has to be scaled to the scalar's magnitude or the pin is
    # vacuous.  The residual here is ~4e-6; this rejects anything outside a
    # relative 2.5e-13, which the reduction tree's reassociation stays well
    # inside.
    tolerance: 1e-18
    extra_scalars:
      rnorminit: 'CGstep0_stop> rnorminit(?:\^2)?\s*=\s*([0-9.eE+-]+)'
    # SPMD, so the rank lattice is 1x the persistent units the largest
    # geometry provides: 32 nodes x 108 workers = 3456 = 18*16*12, and the
    # lattice is held there for every node count.  (The lattice must be
    # non-increasing -- the program rejects Rx<Ry or Ry<Rz.)  It anti-scales,
    # so the size targets the ~150s window at one node: 138.8s there.
    #
    # Everything but the lattice comes from the program's own references.  The
    # polynomial DOF count is 8 -- what all five of the port's scaling scripts
    # use and what the original's example1 sweeps to -- and the CG count is
    # 100, which the original hardcodes in its driver rather than reading from
    # input.  The one knob left is the element block per rank, which is
    # exactly what the original's input file varies (`iel0,ielN,ielD (per
    # processor)`), so that is what carries the size: 6x6x4 = 144 elements,
    # against the 8 the port's scripts use and the ~512 of the reference
    # inputs.
    expect: '3.95222063651471E-06'
    expect_args: ['18', '16', '12', '6', '6', '4', '8', '100']
    args: ['18', '16', '12', '6', '6', '4', '8', '100']
    # The shipped rank-to-place map is rankID % places, which puts a rank's
    # halo neighbours on other places by construction; the hinted tier gives
    # each place a contiguous box of the lattice instead.  Every place still
    # holds the same number of ranks and every rank the same number of
    # elements, so the balance is unchanged.
    hinted: true

  XSBench_intel:
    binary: XSBench_intel
    # Master/Worker over a task-parallel map: one central producer chain
    # spawns every lookup as a transient task; the SPMD member of the pair
    # is the sharedDB sibling — same algorithm, two implementation
    # structures, which is the whole ablation.
    class: mw
    provenance: 'XSBench Monte Carlo neutron-transport proxy (ANL)'
    marker: 'Lookups/s'
    scalar_re: 'XSBench grid checksum:\s+(\d+)'
    scalar_kind: int
    expect: '5538757267561331960'
    expect_args: ['-s', 'large', '-g', '96', '-l', '300000', '-b', '3456']
    # The compute plane is wire-bound and mildly anti-scaling in every arm
    # (each lookup is a spawned three-task chain whose aggregator fans in
    # one nuclide-grid DB per nuclide of the drawn material), so this is an
    # exhibition row sized by the worst cell against the 600 s bentley
    # ceiling; a Dane-geometry single node runs it in seconds, the accepted
    # shape for an anti-scaling row.  The grid checksum depends only on
    # -s/-g, so the pin survives -l changes.
    # -s large is the benchmark's canonical configuration (355 isotopes,
    # 321-nuclide fuel fan-in; small is its reduced fresh-fuel subset) and
    # changes no structure — one-node rate is identical (261K lookups/s).
    # What large multiplies is init's dependence registrations
    # (n_isotopes^2 x g), so -g compensates: g=96 keeps a 34K-DB exploded
    # plane while holding init to ~150 s at multinode (measured 2n
    # hinted val_wb: 148 s init; g=192 doubles it, g=1000 is minutes to
    # hours).  Resolution below the official 11303 is disclosed either way;
    # the lookup structure does not depend on it.
    # -b is the in-flight window (lookup chains per sync batch) — this
    # variant's width knob.  Master/Worker width rule, calibrated once at
    # the largest geometry: the pool is the work count (-l, already far
    # above the worker count) and the WINDOW covers the machine exactly —
    # 3456 = the 32x108 campaign's total workers — so the row's
    # anti-scaling is attributable to the program's central serial
    # production, never to an under-provisioned window.  Measured
    # throughput is insensitive to the width (within ~7% across
    # 1024..13824), which is itself evidence that production, not the
    # window, binds.
    args: ['-s', 'large', '-g', '96', '-l', '300000', '-b', '3456']
    hinted: true
    # No restructured version, by decision: any distribution-friendly rebuild
    # of this program converges on the sibling XSBench_intel_sharedDB (its
    # own catalog row) — per-lookup tasking pays more runtime work per lookup
    # than the kernel itself, so the only way up is coarse inline chains over
    # a per-instance replica, which is exactly what that sibling already is
    # (and what the shelved Main_dist.c driver was).  The pair IS the
    # decomposition ablation; a restructured row would duplicate it.
  XSBench_intel_sharedDB:
    binary: XSBench_intel_sharedDB
    class: spmd
    provenance: 'XSBench (ANL); shared-datablock form'
    marker: 'Workload\s+\(unit\):'
    scalar_re: 'Workload\s+\(unit\):\s+(\d+)'
    scalar_kind: int
    expect: '50000000'
    expect_args: ['-s', 'large', '-g', '96', '-l', '50000000', '-t', '108', '-p', '32']
    # -s/-g match XSBench_intel (same physics table; the set convention is
    # that the table is identical and only the decomposition differs).
    # The sweep invariant is the TOTAL logical quantity, realized in its
    # strict form: every count is literally node-count-invariant — 32 SPMD
    # instances, 108 chains each (1x the campaign node's persistent
    # workers, the SPMD width rule), 50M lookups per instance = a constant
    # 1.6G aggregate.  The application never names the machine: the fork's
    # block partition maps the 32 instances onto however many PDs the run
    # has (every campaign node count divides 32, so the packing is exactly
    # even), one instance per node at the calibration geometry.
    args: ['-s', 'large', '-g', '96', '-l', '50000000', '-t', '108', '-p', '32']

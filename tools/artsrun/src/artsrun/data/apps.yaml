  nekbone:
    binary: nekbone
    class: spmd
    provenance: 'Nekbone (Nek5000 proxy)'
    marker: 'FinalEDT'
    # The final residual is the one printed value that observes the CG loop
    # (matvec, halo, reductions); the initial residual is computed before it
    # and stays as a secondary scalar.
    scalar_re: 'CGloop_stop> rnormfinal(?:\^2)?\s*=\s*([0-9.eE+-]+)'
    # artsrun uses the tolerance as an absolute floor as well as a relative
    # one, so it has to be scaled to the scalar's magnitude or the pin is
    # vacuous.  The residual here is ~4e-6; this rejects anything outside a
    # relative 2.5e-13, which the reduction tree's reassociation stays well
    # inside.
    tolerance: 1e-18
    extra_scalars:
      rnorminit: 'CGstep0_stop> rnorminit(?:\^2)?\s*=\s*([0-9.eE+-]+)'
    # SPMD, so the rank lattice is 1x the persistent units the largest
    # geometry provides: 32 nodes x 108 workers = 3456 = 18*16*12, and the
    # lattice is held there for every node count.  (The lattice must be
    # non-increasing -- the program rejects Rx<Ry or Ry<Rz.)  The base tier
    # anti-scales, so the size targets the 10-30 s window at one node rather
    # than the ~150 s a strong scaler gets.  Both tiers run these arguments:
    # the hint layer is a no-op at one place, so the two share an anchor, and
    # the window belongs to the tier that has to survive the whole node sweep.
    #
    # Everything but the lattice comes from the program's own references.  The
    # polynomial DOF count is 8 -- what all five of the port's scaling scripts
    # use and what the original's example1 sweeps to -- and the CG count is
    # 100, which the original hardcodes in its driver rather than reading from
    # input.  The one knob left is the element block per rank, which is
    # exactly what the original's input file varies (`iel0,ielN,ielD (per
    # processor)`), so that is what carries the size: 3x3x3 = 27 elements,
    # against the 8 the port's scripts use and the ~512 of the reference
    # inputs.  Measured 24.5 / 23.5 / 24.0 s across the three families,
    # 15.5 GB.
    #
    # The block is pure GRAIN and costs no width: EDT creations are identical
    # -- 6,401,025 of them -- at 144, 27 and 24 elements a rank, so the task
    # population is the rank lattice's and the block only sets how much work
    # each task does.  What the block does change is the halo's share, since
    # its surface falls more slowly than its volume, and that is why the shape
    # is kept as cubic as the count allows: 3x3x3 and 4x4x2 both give a
    # surface-to-volume of 2.0 where 4x3x2 gives 2.17, and of the two that fit
    # the window this is the one with more elements per rank.
    expect: '1.30069594398318E-06'
    expect_args: ['18', '16', '12', '3', '3', '3', '8', '100']
    args: ['18', '16', '12', '3', '3', '3', '8', '100']
    # The shipped rank-to-place map is rankID % places, which puts a rank's
    # halo neighbours on other places by construction; the hinted tier gives
    # each place a contiguous box of the lattice instead.  Every place still
    # holds the same number of ranks and every rank the same number of
    # elements, so the balance is unchanged.
    hinted: true
    restructured_as: nekbone_dist

  nekbone_dist:
    binary: nekbone_dist
    class: spmd
    provenance: 'Nekbone (Nek5000 proxy); reduction restructured'
    marker: 'FinalEDT'
    scalar_re: 'CGloop_stop> rnormfinal(?:\^2)?\s*=\s*([0-9.eE+-]+)'
    tolerance: 1e-18
    extra_scalars:
      rnorminit: 'CGstep0_stop> rnorminit(?:\^2)?\s*=\s*([0-9.eE+-]+)'
    # Same lattice and same iteration count as the row it re-implements -- the
    # rewrite is in the all-reduce, not in the problem.  The tree reassociates
    # the sum differently, so the residual agrees to the tolerance rather than
    # bit-for-bit.
    expect: '3.95222063651471E-06'
    expect_args: ['18', '16', '12', '6', '6', '4', '8', '100']
    args: ['18', '16', '12', '6', '6', '4', '8', '100']
    restructured_from: nekbone

  npb_cg:
    binary: npb_cg
    class: task
    provenance: 'NAS Parallel Benchmarks CG'
    marker: 'Verification SUCCESSFUL'
    scalar_re: 'Verification SUCCESSFUL \(zeta\s*=\s*([\-+0-9.eE]+)'
    tolerance: 1e-10
    # Fork-join: per matvec, na/blk transient row tasks and one gather whose
    # dependence count IS na/blk.  Anti-scaler -- the whole-vector broadcast,
    # the single-EDT gather and the serial vector spine make every added node
    # cost time -- so the class stays at A (B already times out at two nodes).
    # -b is set by the widest geometry: 7000 tasks per matvec is 2.0x 32 Dane
    # nodes' 3456 workers, and lands the anchor at 25.3s.  4x (-b 1) is
    # reachable but costs 67.2s at one node and grows from there.  The pin is
    # the class's own reference zeta, so it is live at args.
    expect: '17.1721077015265'
    expect_args: ['-t', 'A', '-b', '2']
    args: ['-t', 'A', '-b', '2']
    restructured_as: npb_cg_dist

  npb_cg_dist:
    binary: npb_cg_dist
    class: spmd
    provenance: 'NAS Parallel Benchmarks CG; row-band SPMD rewrite'
    marker: 'Verification SUCCESSFUL'
    scalar_re: 'Verification SUCCESSFUL \(zeta\s*=\s*([\-+0-9.eE]+)'
    tolerance: 1e-10
    # SPMD: one persistent chain per rank, 256 row slices inside it (2.4x a
    # node's workers).  Scaler, and the anchor IS the worst cell (dane1 471s).  D is the
    # largest class that runs: E's 72MB operand puts every gather in DRAM
    # behind a TLB walk and takes >19h at one node, while C is 32.6s.  -i
    # cannot bridge the two -- D reaches the benchmark's own 1e-8 bar only
    # near iteration 85 of its 100 -- so the published count stands and
    # the pin is the class's reference zeta (the run prints it to 4e-13).
    # Every rank replays the draw stream itself, so construction never
    # crosses the wire and init is flat in node count.
    expect: '52.5239203995295'
    expect_args: ['-t', 'D']
    args: ['-t', 'D']
    restructured_from: npb_cg

  nqueens:
    binary: nqueens
    class: task
    provenance: 'N-Queens'
    marker: 'sols:\s*\d+'
    scalar_re: 'sols:\s*(\d+)'
    scalar_kind: int
    # Fork-join enumeration.  rounds is pure repetition -- the shutdown EDT
    # restarts the identical solve -- so it stays 1 and the size carries the
    # weight instead.  The two remaining dials are one plane, not two knobs:
    # cutoff fixes max_set = n - cutoff, hence how many levels spawn at all,
    # and scatter says how many of those levels cross ranks.  Swept at n=20
    # over 8 nodes: the cost tracks the NUMBER of scattered tasks, which is
    # exponential in depth, so scattering every spawning level is right only
    # while that count stays near 1e5 (c13 s8 scatters 28M and costs 540s
    # against the optimum's 284s).  c17 s5 is the fastest cell at 283.6s but
    # leaves only 72k units -- 21 per worker at 32 nodes -- and already shows
    # 1.19x work imbalance at 8; c16 s6 gives 789k units, 1.05x imbalance and
    # 287.2s, so the campaign knowingly pays the 1.3% for 10x the headroom
    # (the band is under 0.1%: s7 saturates to the same run as s6 and read
    # 287.3).  scatter 6 is the smallest value meaning "everything" here --
    # s5 leaves the sequential leaves local and costs 295.1.
    #
    # Those two settle the WIDTH plane and are held; n carries the size, and
    # the cutoff moves with it so max_set stays 4.  The base tier anti-scales,
    # so n targets the 10-30 s window: 31.4 / 30.5 / 30.5 s across the three
    # families.  DELIBERATE DEVIATION, and it is forced -- n is an integer and
    # the enumeration grows by roughly a factor of seven per step, so 18 is
    # 4.2 s and there is no rung in between.  Narrowing max_set instead would
    # buy the seconds by giving up width, which the rule forbids.
    expect: '4968057848'
    expect_args: ['19', '15', '1', '6']
    args: ['19', '15', '1', '6']
    hinted: true
    # The HPX port (benchmarks/hpx/nqueens.cpp) carries the same bitmask
    # search, cutoff, and mixed-key scatter placement as the hinted OCR
    # version, and takes the same argument list — so it runs in the hinted
    # row, against the tier whose structure it mirrors.
    hpx: true

  p2p:
    binary: p2p
    class: spmd
    provenance: 'Parallel Research Kernels synch_p2p (pipelined wavefront)'
    marker: 'PASS checksum'
    scalar_re: 'PASS checksum\s*=\s*([\-+0-9.eE]+)'
    tolerance: 1e-08
    expect: '44706783.000000'
    expect_args: ['6912', '1347840', '6913', '32']
    # The hinted tier is DISCARDED, measured rather than assumed: 0.87x at two
    # nodes over five interleaved runs a side, 0.99x at four, 0.97x at eight.
    # What the layer homed is the per-phase boundary block, at its one consumer,
    # which helps only a handoff that crosses a policy domain -- and the
    # application's own unguarded `#define BLOCK` already lays its ranks out
    # contiguously, so almost none do.  Forcing the strided map instead (the
    # branch BLOCK turns off) costs 11x at one rank per worker, which is the
    # size of the locality the application had already claimed for itself.  The
    # resident blocks are not a surface either: homing `data` and `private`
    # explicitly measures the same as first touch, because the rank's own init
    # task creates them.  Nothing is left for a hint to take, so the source
    # carries no placement guard and no hinted target is built.
    #
    # p is the number of virtual ranks, an application-level decomposition knob
    # with no relation to the worker threads arts.cfg starts.  The wavefront's
    # width is min(p, n-1) -- rank i phase j waits on rank i-1 phase j and on
    # its own phase j-1 -- and its average over a sweep is p(n-1)/(p+n-2), so
    # both p and the row count have to clear the worker total, not just one of
    # them.  p = n-1 is where they balance: for a given array it buys the most
    # width.  At p = 6912 = 2x the largest geometry's 3456 workers, with
    # n = p+1, the peak width is 2.00x the workers and the AVERAGE is 1.00x --
    # the bound met over the whole sweep, fill and drain included, rather than
    # at the peak alone.  Columns stay at the application's own m, so raising p
    # costs no memory in the array; what it does cost is live boundary blocks,
    # since the channel's maxGen lets a producer run n generations ahead
    # (159 GB here, 271 GB at p = 6912 with n = 10369, past the 256 GB ceiling).
    # The catalog ran `3456 8192 50 2100` before this cycle -- 2.4 columns a
    # rank and a width of 49 against 3456 workers, a latency probe rather than
    # the benchmark -- and then `3456 1347840 500 515`, whose width was 499
    # because the row count, not p, was the binding one.
    # gf stays 1: the README calls any other value cheating and negates the
    # reported flop rate.  This is the one row of its cycle that strong-scales,
    # and the gain per doubling grows rather than fades -- 1.17x, 1.66x, 1.81x,
    # 3.50x over eight nodes -- so it is calibrated against ~150 s, which the
    # iteration count reaches at t = 32: 146.2 s, 145.3 s and 152.8 s across the
    # three families, holding 159-175 GB.
    args: ['6912', '1347840', '6913', '32']

  printf:
    binary: printf
    class: task
    provenance: 'OCR output fixture'
    kind: toy
    marker: 'Hello from mainEdt'
    scalar_kind: bool
    args: []
    default_enabled: false

  prodcon:
    binary: prodcon
    class: spmd
    provenance: 'OCR tagged-scheduler producer/consumer kernel'
    kind: toy
    marker: 'MB/s'
    scalar_kind: bool
    args: ['48', '8000000', '6000']
    default_enabled: false

  quicksort:
    binary: quicksort
    class: task
    provenance: 'Quicksort'
    marker: 'QSORT_VALID'
    # The row used to pin the digits printed just before "Sorting Finished",
    # which is the thirtieth element of the sorted array -- a sort that
    # misordered values passed it, and one did.  Both tiers now print the check
    # the rewrite already had: non-decreasing over the whole array, the element
    # count, and the sum a permutation must preserve.  `sorted=0` makes the
    # pattern miss and the cell fail.
    scalar_re: 'QSORT_VALID sum=(\d+) sorted=1'
    scalar_kind: int
    # Size is the array.  This tier anti-scales, so the anchor window is 10-30 s
    # rather than the ~150 s a strong scaler gets: 6,000,000 puts the hinted
    # tier at 21.6 s, with base at 21.7 s beside it.  The restructured row is
    # calibrated separately -- it is a different program with its own
    # scaling behaviour, and at this size it finishes in a quarter of a second
    # and shows nothing.
    # The range is the program's own default (RANGE in quicksort.c): nothing
    # about the experiment picks it, and it changes only how many values
    # repeat, not the decomposition or the task count.
    # Most of that is the input: the program's own generator walks a
    # thousand-entry table per element, in one task, before any sorting starts.
    # That is the base tier's structure and the restructured tier is what
    # removes it.
    expect: '3000132336560'
    expect_args: ['6000000', '1000000']
    args: ['6000000', '1000000']
    # The source carries a placement layer that had never been built.  Every
    # task in the recursion acquires the SAME block RW -- the children are
    # handed the same GUID and differ only in their index range -- so the layer
    # cannot distribute the work; what it can do is stop the block from chasing
    # the recursion, by placing a subarray's tasks where the range they sort
    # lives.  That covers every node, and it holds the anchor flat where base
    # degrades: 14.1 s at one node and 14.2 s at four, against base's 57.6 s.
    hinted: true
    restructured_as: quicksort_dist

  quicksort_dist:
    binary: quicksort_dist
    class: task
    provenance: 'Sample-splitter distributed sort'
    marker: 'QSORT_VALID'
    scalar_re: 'QSORT_VALID sum=(\d+) sorted=1'
    scalar_kind: int
    # The same array and range as the row it re-implements, so the same answer:
    # the generator is a pure function of the index, and each chunk now
    # produces its own slice rather than reading a block one task filled.
    #
    # The third and fourth arguments are this rewrite's decomposition, buckets
    # and chunks, and the width rule sets them: a dataflow DAG asks for ~4x the
    # 3456 persistent units the largest geometry provides, and 6912 each gives
    # 13,824.  What the rule fixes is the width, and the width is what these
    # two arguments are; the decomposition is place-persistent, so each place
    # builds its own chunks and buckets where it runs and no phase is wider or
    # narrower than the rule set it.
    # A direct chunk-to-bucket exchange would make their product the block
    # count -- 47.8 million blocks carrying 0.84 elements each.  The exchange
    # is aggregated per place instead: a place packs everything it owes a peer
    # into one buffer, so it costs P(P-1) messages whatever the width.
    # The last argument is the place count -- the number of partitions the
    # program owns its work and aggregates its exchange in.  It is an argument
    # and not the rank count, so the task and datablock counts, and the order
    # the partials combine in, are identical in every geometry; the runtime
    # maps the places onto whatever ranks exist through a hint.  32 is one
    # place per node at the largest geometry, which is where the calibration
    # is taken, and it is the same convention XSBench's `-p 32` uses.
    expect: '1999775745532436'
    expect_args: ['4000000000', '1000000', '6912', '6912', '32']
    args: ['4000000000', '1000000', '6912', '6912', '32']
    restructured_from: quicksort

  reduction_intel:
    binary: reduction_intel

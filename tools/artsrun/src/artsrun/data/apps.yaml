    scalar_kind: int
    expect: '50000000'
    expect_args: ['-s', 'large', '-g', '96', '-l', '50000000', '-t', '108', '-p', '32']
    # -s/-g match XSBench_intel (same physics table; the set convention is
    # that the table is identical and only the decomposition differs).
    # The sweep invariant is the TOTAL logical quantity, realized in its
    # strict form: every count is literally node-count-invariant — 32 SPMD
    # instances, 108 chains each (1x the campaign node's persistent
    # workers, the SPMD width rule), 50M lookups per instance = a constant
    # 1.6G aggregate.  The application never names the machine: the fork's
    # block partition maps the 32 instances onto however many PDs the run
    # has (every campaign node count divides 32, so the packing is exactly
    # even), one instance per node at the calibration geometry.
    args: ['-s', 'large', '-g', '96', '-l', '50000000', '-t', '108', '-p', '32']

  RSBench_intel:
    binary: RSBench_intel
    # Master/Worker over a task-parallel map, the same central-producer
    # batch chain as XSBench_intel (nprocs is hardcoded to 1); the SPMD
    # member of the pair is the sharedDB sibling.
    class: mw
    provenance: 'RSBench multipole cross-section proxy (ANL)'
    marker: 'Lookups:'
    scalar_re: 'RSBench pole checksum:\s+(\d+)'
    scalar_kind: int
    # The pole-data checksum depends on -s/-p/-w/numL only (fixed rand()
    # sequence, no srand anywhere), so the pin survives -l changes.
    expect: '8991421287304279555'
    expect_args: ['-s', 'large', '-l', '1500000', '-b', '3456']
    # Same shape and rules as XSBench_intel: central serial production caps
    # the row (~98K lookups/s at 15 workers, LESS at 108 — spawn-limited),
    # multinode is wire-bound (~0.6-0.7K lookups/s at 2 nodes), init is
    # negligible (the exploded plane is only ~3 DBs per nuclide).  Both tiers
    # anti-scale, so -l is sized to the 10-30 s anchor window and both run it:
    # 13.6 / 15.9 / 20.4 s across the three families, and the slowest of the
    # three is what the window has to hold.  It is NOT sized from a reduced
    # multi-rank cell -- that geometry reads shape only, and cutting the
    # catalog to its ceiling would be sizing the program from the machine.
    #
    # DISCLOSED: the reference workload is 10,000,000 lookups, which this port
    # keeps as its own default, and this row runs 15% of it.  The reason is the
    # row's exhibit rather than a concession -- central serial production caps
    # throughput, so the reference workload would put the anchor at about the
    # time a strong scaler is given while this tier anti-scales.  The SPMD
    # sibling on the same physics runs 3.2x the reference in aggregate
    # (32 instances of 1,000,000), which is what the pair is for;
    # -b 3456 is the Master/Worker window rule
    # (cover the largest machine); -s/-p/-w stay at the benchmark's
    # canonical defaults (H-M large, 1000 poles, 100 windows; this port has
    # no nprocs, so -p is the poles flag here — only sharedDB renamed it -a).
    # -s large IS the port's default — named explicitly so the selection is
    # self-documenting, unlike XSBench_intel whose default is small.
    args: ['-s', 'large', '-l', '1500000', '-b', '3456']
    hinted: true

  RSBench_intel_sharedDB:
    binary: RSBench_intel_sharedDB
    class: spmd
    provenance: 'RSBench (ANL); shared-datablock form'
    marker: 'Simulation complete\.'
    scalar_re: '(?m)^\s*(?:\[\d+\]\s*)?Lookups:\s*(?:\[\d+\]\s*)?([0-9]+)\s*$'
    scalar_kind: int
    expect: '2200000'
    expect_args: ['-s', 'large', '-l', '2200000', '-t', '108', '-p', '32']
    # The scalar is the workload echo (completion-level), the same convention
    # as XSBench_intel_sharedDB: the app's computed answer (the slow-Faddeeva
    # counters) is delivered through its labeled-GUID reduction-tree library,
    # and that delivery is observably nondeterministic under this runtime's
    # labeled semantics (create replaces) — 17 sweep cells printed 17 distinct
    # sums on identical inputs — so no computed value can be pinned.  The
    # anchored regex skips the startup "XS Lookups:" echo.
    # Strict sweep invariant (same convention as XSBench_intel_sharedDB,
    # same fork-SPMD code family): every logical count is node-invariant —
    # 32 instances, 108 chains each (1x the campaign node's persistent
    # workers), 2,200,000 lookups per instance = a constant 70.4M aggregate.
    # The fork's block partition maps the 32 instances onto however many PDs
    # the run has.
    #
    # This decomposition SCALES where the Master/Worker sibling does not --
    # 16.2 -> 8.7 -> 5.3 -> 1.8 s over 1..8 reduced-geometry ranks -- so -l is
    # sized to the strong scaler's ~150 s: 147.9 / 104.5 / 108.9 s across the
    # three families at the one-node anchor, 5.5 GB.  The previous figure was
    # taken at a 15-WORKER node, which is not the anchor geometry and left the
    # row at 67.8 s where the anchor actually runs.
    args: ['-s', 'large', '-l', '2200000', '-t', '108', '-p', '32']

  rwmix:
    binary: rwmix
    class: mw
    # The engine behind the attack rows rather than a measurement of its own:

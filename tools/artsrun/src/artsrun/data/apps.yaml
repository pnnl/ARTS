    class: mw
    kind: attack
    provenance: 'attack matrix C5: one resident writer churning under a reader mill'
    marker: 'RWSTEADY OK '
    scalar_kind: bool
    # 465 readers x 50,000 against ONE writer x 2,000 on a 1 MB block, with a
    # 5 us think time so the copy's lifetime is short: readers grind while the
    # data underneath them keeps moving.
    # TARGET: arms that must re-establish a reader copy after every churn.
    # Crown: INV x WB 1.23 s.
    # Grave: EXCL x PURGE 17.9 s (14.5x).
    # Caveat worth carrying: the writer's own receipts run 228x the OTHER way,

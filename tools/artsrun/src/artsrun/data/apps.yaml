  rwhandoff:
    binary: rwhandoff
    class: mw
    # The engine behind the attack rows rather than a measurement of its own:
    # a column of the suite is one of those rows, which owns the workload and
    # names what it is built to prove.  This entry exists so the binary and its
    # result line have a home.
    kind: attack
    provenance: 'phase-alternating producer/consumer handoff probe, written for this repo'
    # Each generation's release wakes one consumer and one next producer on
    # rotating ranks touching byte-disjoint regions: race-free by event
    # order, zero batching fodder for a block-granular protocol.  A failed
    # consumer withholds its latch decrement, so the marker never prints.
    # args: L NREG BYTES E_HOLD_W E_HOLD_R E_THINK T_MS WARM_MS CENSUS
    #       CROSSCLOCK
    marker: 'RWHANDOFF OK '
    scalar_kind: bool
    extra_scalars:
      GENS: 'GENS=([0-9]+)'
      GXPUT: 'GXPUT=([-0-9.]+)'
      WREL_P50: 'WREL_P50=([-0-9.]+)'
      WREL_P99: 'WREL_P99=([-0-9.]+)'
      WREL_MEAN: 'WREL_MEAN=([-0-9.]+)'
      GTOT_P50: 'GTOT_P50=([-0-9.]+)'
      GTOT_P99: 'GTOT_P99=([-0-9.]+)'
      GTOT_MEAN: 'GTOT_MEAN=([-0-9.]+)'
    args: ['16', '8', '65536', '1', '1', '20', '4000', '1500', '0', '1']

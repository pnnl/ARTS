    args: ['403', '62', '1', '1', '20', '1048576', '31', '600000', '0', '0', '0', '1', '1', '0', '0', '1', '4000', '2000', '0']
    args_by_nodes:
      8: ['91', '14', '1', '1', '20', '1048576', '7', '120000', '0', '0', '0', '1', '1', '0', '0', '1', '4000', '2000']
    default_enabled: false
    timeout: 900
    multinode_timeout: 900
  alternating_bomb_64k:
    binary: rwsteady
    class: mw
    kind: attack
    provenance: 'attack matrix C11: two alternating writers against a wide sharer set'
    marker: 'RWSTEADY OK '
    scalar_kind: bool
    # WSPREAD=2 makes the two writers alternate on the SAME block while 463
    # readers hold copies of it: the pattern that defeats batching, because
    # every write turn changes hands and every turn faces the full sharer set.
    # TARGET: write-invalidate, which must run a round against 463 sharers per
    # alternation -- and the arms that serialise readers behind the turn.
    # Crown: the INV trio 13.4-14.5 s on the whole-job view (the anti-INV
    # story is in the writer-tail receipts, not the aggregate).
    # Graves: EXCL x PURGE 79 s (5.9x); EXCL x RETAIN and VAL 3-4x.
    args: ['463', '2', '1', '1', '20', '65536', '1', '600000', '0', '0', '2', '1', '1', '0', '0', '0', '200000', '20000', '0']
    args_by_nodes:
      8: ['103', '2', '1', '1', '20', '65536', '1', '120000', '0', '0', '2', '1', '1', '0', '0', '0', '200000', '20000']
    default_enabled: false

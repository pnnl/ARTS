# xsocr distributed runtime config for correctness harness.
# Rank count is determined by mpirun -n N, not this file.
# Each rank uses 2 workers (1 HC_COMM master + 1 HC slave) to keep
# total thread count low on a laptop (e.g., 5 ranks × 2 = 10 threads).
# Based on third_party/ocr/ocr/machine-configs/x86-mpi/common-dist-8w.cfg.


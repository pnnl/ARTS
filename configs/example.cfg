# ARTS Runtime Reference Configuration
# =====================================
# This file documents all recognized configuration keys, their defaults,
# and their purpose.  It is NOT loaded at runtime — it is documentation.
#
# Usage: copy relevant entries to your arts.cfg and uncomment.
# Runtime looks for arts.cfg in the process working directory,
# or the path set by the ARTS_CONFIG environment variable.
#
# Format: [ARTS] section header is required.

[ARTS]

# =============================================================================
# Threading
# =============================================================================

# Number of worker threads per node.
# Default: 4
# worker_threads=4

# Per-worker stack size in bytes.  0 = OS default (typically 8 MiB).
# Default: 0
# stack_size=0

# Pin worker threads to CPU cores (NUMA-aware).  1=enabled, 0=disabled.
# Default: 1
# pin=1

# Scheduler algorithm.  0=work-stealing deque (default).
# Default: 0
# scheduler=0

# Deque type for the work-stealing scheduler.  0=circular array deque.
# Default: 0
# deque_type=0

# Initial capacity of each worker's deque (number of slots).
# Default: 4096
# worker_init_deque_size=4096

# =============================================================================
# Routing / Scheduling
# =============================================================================

# Route table size as a power of 2 exponent.  2^N entries.
# 14 = 16384 entries (suitable for most workloads).
# Default: 16 (65536 entries)
# route_table_size=16

# Automatic shutdown when the EDT graph drains to zero.
# 0=disabled (explicit arts_shutdown() required),
# 1=enabled (runtime shuts down when work queue empties).
# Default: 0
# auto_shutdown=0

# =============================================================================
# GPU
# =============================================================================

# Number of GPUs to use.  0=disabled, N=use N GPUs.
# Default: 0
# gpu=0

# GPU locality level.  0=default.
# Default: 0
# gpu_locality=0

# GPU fit mode.  0=default.
# Default: 0
# gpu_fit=0

# GPU location-consistency sync mode.  0=default.
# Default: 0
# gpu_lc_sync=0

# Maximum concurrent GPU EDTs.  Unset = no limit.
# gpu_max_edts=<unset>

# Maximum GPU memory per device in bytes.  Unset = all available.
# gpu_max_memory=<unset>

# Enable GPU peer-to-peer transfers.  0=disabled.
# Default: 0
# gpu_p2p=0

# GPU route table size as a power of 2 exponent.  2^N entries.
# Default: 12 (4096 entries)
# gpu_route_table_size=12

# Free DataBlock after GPU kernel completes.  0=keep, 1=free.
# Default: 0
# free_db_after_gpu_run=0

# Run GPU garbage collection when workers are idle.
# Default: 1
# run_gpu_gc_idle=1

# Run GPU GC before each GPU EDT executes.
# Default: 0
# run_gpu_gc_pre_edt=0

# During GPU GC, delete zero-reference DataBlocks.
# Default: 1
# delete_zeros_gpu_gc=1

# Enable GPU output buffering.
# Default: 0
# gpu_buff_on=0

# =============================================================================
# Networking
# =============================================================================

# Number of sender threads per node.  Unset = auto (typically 1).
# sender_threads=<unset>

# Number of receiver threads per node.  Unset = auto (typically 1).
# receiver_threads=<unset>

# Number of TCP ports per node.  Unset = auto.
# port_count=<unset>

# =============================================================================
# Launcher / Multi-node
# =============================================================================

# Process launcher backend.
#   local — spawn child processes on localhost (testing / dev)
#   ssh   — launch via SSH (default for multi-node)
# Default: ssh
# launcher=ssh

# Master node hostname.  Unset = first entry in nodes list.
# master_node=<unset>

# Number of nodes (ranks) in the job.  Handled by the launcher.
# Required for multi-node runs.
# node_count=1

# Comma-separated list of hostnames (one per rank).
# Used when launcher=ssh.
# nodes=host0,host1,host2

# Base TCP port for inter-node communication.
# With launcher=local, port i on node j = default_ports + j * port_count.
# Default: 50000
# default_ports=50000

# Network interface name to bind (e.g. eth0, ib0).  Unset = auto.
# net_interface=<unset>

# Kill mode for abnormal termination.  0=default.
# Default: 0
# kill_mode=0

# =============================================================================
# Debug
# =============================================================================

# Enable core dump on crash.  0=disabled, 1=enabled.
# Default: 0
# core_dump=0

# =============================================================================
# Counters
# =============================================================================

# Directory where counter JSON output files are written.
# Files are named n{node_id}_t{thread_id}.json.
# Default: ./counters
# counter_folder=./counters

# Interval (in EDT executions) between periodic counter captures.
# Only relevant for PERIODIC-mode counters.
# Default: 100
# counter_capture_interval=100

# =============================================================================
# CXL (only available when built with ARTS_USE_CXL=ON)
# =============================================================================

# CXL DataBlock allocation strategy.
# Values depend on the rapid CXL API (e.g. interleaved, local, remote).
# cxl_db_allocation_strategy=<unset>

# CXL device index to allocate DataBlocks on.  Unset = auto.
# cxl_db_allocation_device=<unset>

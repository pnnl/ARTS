# ARTS Framework Counter Configuration

# ============================================================================
# EDT time
# ============================================================================

# Wall-clock time spent executing EDT user functions (paused during yield/wait)
TIME_EDT_EXEC=PERIODIC,CLUSTER

# Time spent in arts_edt_create() — GUID allocation, metadata setup, route table
TIME_EDT_CREATE=OFF

# Time spent in EDT dependency signaling (internal_signal_edt)
TIME_EDT_SIGNAL=OFF

# Time spent saving/restoring EDT thread-local context during preemption
TIME_CONTEXT_SWITCH=OFF

# ============================================================================
# EDT counts
# ============================================================================

# Total number of EDTs created on this rank
NUM_EDT_CREATE=PERIODIC,CLUSTER

# Number of EDTs that resolved all dependencies and became ready to execute
NUM_EDT_ACQUIRE=PERIODIC,CLUSTER

# Number of EDTs that completed execution
NUM_EDT_FINISH=PERIODIC,CLUSTER

# Number of EDT dependency signals (arts_signal_edt calls)
NUM_EDT_SIGNAL=OFF

# Count of voluntary EDT yields (arts_yield and arts_wait_on_handle)
NUM_YIELD=OFF

# ============================================================================
# DB time
# ============================================================================

# Time spent in arts_db_create() — allocation, route table insertion, data copy
TIME_DB_CREATE=OFF

# ============================================================================
# DB counts
# ============================================================================

# Total number of DataBlocks created on this rank
NUM_DB_CREATE=PERIODIC,CLUSTER

# Number of arts_db_destroy() calls
NUM_DB_DESTROY=OFF

# Count of READ-mode DataBlock acquisitions during dependency resolution
NUM_DB_ACQUIRE_READ=OFF

# Count of WRITE-mode DataBlock acquisitions during dependency resolution
NUM_DB_ACQUIRE_WRITE=OFF

# ============================================================================
# Coherence: acquires
# ============================================================================

# Acquires answered from this rank's own copy — no message
NUM_DB_ACQUIRE_LOCAL_HIT=OFF

# Acquires that had to park on a remote round
NUM_DB_ACQUIRE_REMOTE=OFF

# ============================================================================
# DB bytes
# ============================================================================

# Total bytes of DataBlock data allocated via arts_db_create()
BYTES_DB_CREATE=OFF

# ============================================================================
# Coherence: payload
# ============================================================================

# Datablock payload shipped, excluding control traffic
BYTES_DB_PAYLOAD_SENT=OFF

# ============================================================================
# Memory
# ============================================================================

# Running total of allocated minus freed bytes (current heap footprint)
BYTES_MEMORY_FOOTPRINT=PERIODIC,CLUSTER

# ============================================================================
# Network bytes
# ============================================================================

# Total bytes sent over the network to remote ranks
BYTES_REMOTE_SENT=PERIODIC,CLUSTER

# Total bytes received from the network from remote ranks
BYTES_REMOTE_RECEIVED=PERIODIC,CLUSTER

# ============================================================================
# Network counts
# ============================================================================

# Number of remote messages sent (per arts_actual_send call)
NUM_REMOTE_SEND=PERIODIC,CLUSTER

# Number of remote messages received (per completed packet)
NUM_REMOTE_RECEIVE=PERIODIC,CLUSTER

# Outbound messages with total size <= 64 bytes
NET_MSG_LE64=PERIODIC,CLUSTER

# Outbound messages with total size <= 512 bytes (and > 64)
NET_MSG_LE512=PERIODIC,CLUSTER

# Outbound messages with total size <= 4K bytes (and > 512)
NET_MSG_LE4K=PERIODIC,CLUSTER

# Outbound messages with total size <= 64K bytes (and > 4K)
NET_MSG_LE64K=PERIODIC,CLUSTER

# Outbound messages with total size > 64K bytes
NET_MSG_GT64K=PERIODIC,CLUSTER

# Total outbound messages across all buckets (population census)
NET_MSG_TOTAL=PERIODIC,CLUSTER

# ============================================================================
# Network time
# ============================================================================

# Time spent in arts_remote_memory_move() — sending local DB data to remote node
TIME_REMOTE_MOVE=OFF

# ============================================================================
# Event time
# ============================================================================

# Time spent in arts_event_create()
TIME_EVENT_CREATE=OFF

# Time spent in arts_event_satisfy_slot() — signaling all dependents
TIME_EVENT_SIGNAL=OFF

# ============================================================================
# Event counts
# ============================================================================

# Number of arts_event_create() calls
NUM_EVENT_CREATE=OFF

# Number of arts_event_satisfy_slot() calls
NUM_EVENT_SIGNAL=OFF

# ============================================================================
# Scheduling
# ============================================================================

# Number of work-stealing attempts (arts_runtime_steal_from_worker entries)
NUM_STEAL_ATTEMPT=OFF

# Number of successful work steals (non-NULL deque pop_back)
NUM_STEAL_SUCCESS=OFF

# Time spent in arts_yield / arts_wait_on_handle (sleeping/waiting)
TIME_YIELD=OFF

# ============================================================================
# Out-of-order
# ============================================================================

# Number of OO list insertions (deferred operations for not-yet-created targets)
NUM_OO_ENQUEUE=OFF

# ============================================================================
# Validation arm
# ============================================================================

# Snapshot requests put on the wire
NUM_SNAPSHOT_REQUEST=OFF

# Replies with no payload because the requester already held that version
NUM_SNAPSHOT_HEADER_ONLY=OFF

# Size-only CTS replies — the rendezvous leg that makes a size-unknown first touch cost two requests
NUM_SNAPSHOT_SIZE_CTS=OFF
NUM_GRANT_SIZE_CTS=OFF
NUM_EXCL_SIZE_CTS=OFF
NUM_INV_SIZE_CTS=OFF

# Combining windows opened (one request each)
NUM_RO_COMBINE_WINDOW=OFF

# Readers that joined an open window instead of asking
NUM_RO_COMBINE_JOINED=OFF

# ============================================================================
# Invalidation arm
# ============================================================================

# Invalidation rounds opened at the home
NUM_INVALIDATE_ROUND=OFF

# INVALIDATE messages multicast to sharers
NUM_INVALIDATE_SENT=OFF

# Invalidation acks collected
NUM_INVALIDATE_ACK=OFF

# Time a release blocked on its invalidation round
TIME_INVALIDATE_ROUND=OFF

# ============================================================================
# Write grant
# ============================================================================

# Write grants that had to move between ranks
NUM_GRANT_MIGRATE=OFF

# Write turns taken on a grant this rank already held
NUM_GRANT_LOCAL_REUSE=OFF

# ============================================================================
# Exclusion arm
# ============================================================================

# Turns that could not be granted on arrival and queued
NUM_EXCL_QUEUE_WAIT=OFF

# ============================================================================
# Per-object
# ============================================================================

# Per-object EDT invocations, keyed by arts_id
OBJ_NUM_EDT=OFF

# Per-object execution time, keyed by arts_id
OBJ_TIME_EDT_EXEC=OFF

# Per-object datablock acquires, keyed by the acquiring EDT
OBJ_NUM_DB=OFF

# Per-object bytes acquired from a local copy
OBJ_BYTES_DB=OFF

# Per-object bytes that had to be fetched

# Per-object acquires that had to fetch
OBJ_NUM_DB_CACHE_MISS=OFF

# Per-invocation EDT records (detailed trace)
OBJ_TRACE_EDT=OFF

# Per-invocation datablock records (detailed trace)
OBJ_TRACE_DB=OFF

# ============================================================================
# Publish flight machine / grant plane rare-path coverage
# ============================================================================

# Publish flights launched (payload or control)
NUM_PUB_FLIGHT=ONCE,NODE
# Releases coalesced into an already-open flight (write combining)
NUM_PUB_FLIGHT_JOIN=ONCE,NODE
# Trailing relaunches for waiters an ACK left uncovered
NUM_PUB_FLIGHT_TRAILING=ONCE,NODE
# Credit-less announce legs (credit teachers not covering a workload)
NUM_PUB_CTS_FALLBACK=ONCE,NODE
# Parked publish waiters woken by destroy/teardown instead of an ACK
NUM_PUB_FLIGHT_ABANDON=ONCE,NODE
# Post-release re-check found queued work and re-claimed the baton
NUM_GRANT_BATON_RECLAIM=ONCE,NODE
# Ownership grants into the WT home (permission only, no payload)
NUM_GRANT_HOME_DATALESS=ONCE,NODE

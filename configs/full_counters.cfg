# ARTS Full Counter Configuration
# This file enables all 48 counters for performance analysis builds.
# Format: COUNTER_NAME=MODE,LEVEL[,REDUCE]
# Modes: ONCE, PERIODIC
# Levels: CLUSTER, NODE
# Reduce: SUM (default), MAX, MIN, MASTER

# Time: EDT lifecycle
TIME_EDT_EXEC=PERIODIC,CLUSTER
TIME_EDT_CREATE=ONCE,CLUSTER
TIME_EDT_SIGNAL=ONCE,CLUSTER
TIME_CONTEXT_SWITCH=ONCE,CLUSTER

# Num: EDT lifecycle
NUM_EDT_CREATE=PERIODIC,CLUSTER
NUM_EDT_ACQUIRE=PERIODIC,CLUSTER
NUM_EDT_FINISH=PERIODIC,CLUSTER
NUM_EDT_SIGNAL=PERIODIC,CLUSTER
NUM_YIELD=PERIODIC,CLUSTER

# Time: DB lifecycle
TIME_DB_CREATE=ONCE,CLUSTER
TIME_DB_GET=ONCE,CLUSTER
TIME_DB_PUT=ONCE,CLUSTER

# Num: DB lifecycle
NUM_DB_CREATE=PERIODIC,CLUSTER
NUM_DB_GET=PERIODIC,CLUSTER
NUM_DB_PUT=PERIODIC,CLUSTER
NUM_DB_DESTROY=PERIODIC,CLUSTER
NUM_DB_ACQUIRE_READ=PERIODIC,CLUSTER
NUM_DB_ACQUIRE_WRITE=PERIODIC,CLUSTER
NUM_OWNER_UPDATE_SAVED=ONCE,CLUSTER
NUM_OWNER_UPDATE_PERFORMED=ONCE,CLUSTER

# Bytes: DB data
BYTES_DB_CREATE=ONCE,CLUSTER
BYTES_DB_PUT=ONCE,CLUSTER

# Bytes: memory
BYTES_MEMORY_FOOTPRINT=PERIODIC,CLUSTER,MAX

# Bytes: network
BYTES_REMOTE_SENT=PERIODIC,CLUSTER
BYTES_REMOTE_RECEIVED=PERIODIC,CLUSTER

# Num: network
NUM_REMOTE_SEND=PERIODIC,CLUSTER
NUM_REMOTE_RECEIVE=PERIODIC,CLUSTER

# Time: network
TIME_REMOTE_MOVE=ONCE,CLUSTER

# Time: events
TIME_EVENT_CREATE=ONCE,CLUSTER
TIME_EVENT_SIGNAL=ONCE,CLUSTER

# Num: events
NUM_EVENT_CREATE=ONCE,CLUSTER
NUM_EVENT_SIGNAL=ONCE,CLUSTER

# Num: scheduling
NUM_STEAL_ATTEMPT=ONCE,CLUSTER
NUM_STEAL_SUCCESS=ONCE,CLUSTER

# Time: scheduling
TIME_YIELD=ONCE,CLUSTER

# Num: epoch
NUM_EPOCH_CREATE=ONCE,CLUSTER

# Num: out-of-order
NUM_OO_ENQUEUE=ONCE,CLUSTER

# Object counters — per arts_id tracking
OBJ_NUM_EDT=ONCE,NODE
OBJ_TIME_EDT_EXEC=ONCE,NODE
OBJ_TIME_EDT_STALL=ONCE,NODE
OBJ_NUM_DB=ONCE,NODE
OBJ_BYTES_DB_LOCAL=ONCE,NODE
OBJ_BYTES_DB_REMOTE=ONCE,NODE
OBJ_NUM_DB_CACHE_MISS=ONCE,NODE
OBJ_TRACE_EDT=ONCE,NODE
OBJ_TRACE_DB=ONCE,NODE

# Time: runtime phases
TIME_INIT=ONCE,CLUSTER,MASTER
TIME_TOTAL=ONCE,CLUSTER,MASTER

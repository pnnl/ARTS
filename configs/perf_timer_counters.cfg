# Performance harness counter set. All CLUSTER level → per-rank values land in
# n{id}.json, cluster totals in cluster.json. 250 ms PERIODIC sampling.
#
# End-to-end wall time is NOT a counter here: it is emitted as the env-gated
# "[E2E] <ns>" stderr marker (rank 0), identical across arts/xsocr/ocr-vx, so
# the comparison uses one definition. This file carries only the per-rank
# coherence metrics.
counter_capture_interval=250

# EDT_CREATE = where an EDT is CREATED (graph500 etc. create centrally on rank 0
# then place by affinity); EDT_FINISH/ACQUIRE = where an EDT actually RAN. The
# per-rank EDT_FINISH spread is the true test of multinode work distribution.
NUM_EDT_CREATE=PERIODIC,CLUSTER
NUM_EDT_ACQUIRE=PERIODIC,CLUSTER
NUM_EDT_FINISH=PERIODIC,CLUSTER
NUM_DB_CREATE=PERIODIC,CLUSTER

BYTES_REMOTE_SENT=PERIODIC,CLUSTER
BYTES_REMOTE_RECEIVED=PERIODIC,CLUSTER
NUM_REMOTE_SEND=PERIODIC,CLUSTER
NUM_REMOTE_RECEIVE=PERIODIC,CLUSTER

NUM_DB_ACQUIRE_READ=PERIODIC,CLUSTER
NUM_DB_ACQUIRE_WRITE=PERIODIC,CLUSTER
NUM_OWNER_UPDATE_PERFORMED=ONCE,CLUSTER
NUM_OWNER_UPDATE_SAVED=ONCE,CLUSTER
TIME_EDT_EXEC=ONCE,NODE
TIME_EDT_CREATE=ONCE,NODE
TIME_EDT_SIGNAL=ONCE,NODE
TIME_DB_CREATE=ONCE,NODE

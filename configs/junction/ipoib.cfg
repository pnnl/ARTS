[ARTS]
################################################################################
# junction cluster — IPoIB fallback (tcp provider bound to the IB interface).
#
# Same Slurm launch shape as verbs.cfg.  Use when the verbs provider is
# unavailable or being ruled out: the tcp provider is steered onto the IB
# network by binding its source address to the ib* interface, so the data
# plane still crosses InfiniBand (as IP) while bootstrap stays on the
# management network.  net_interface matches by exact name, then by prefix,
# so "ib" covers hosts whose suffixes differ (ib0, ib1, ...).
################################################################################

worker_threads=63
progress_threads=1

provider=tcp
net_interface=ib

pin=1
route_table_size=16
ports=25000
core_dump=1

[ARTS]
################################################################################
# junction cluster — InfiniBand data plane (verbs provider), Slurm launcher.
#
# Nodes: j001-j048, 64 cores each (2 sockets x 32, no SMT); allocations are
# node-exclusive, max 32 nodes per job.  Launch shape:
#   srun -N<k> --ntasks-per-node=1 --cpus-per-task=64 <app>
# The Slurm env (SLURM_PROCID / SLURM_NNODES / SLURM_STEP_NODELIST) supplies
# rank, node count, and the routing table, so this one file serves every -N.
# The TCP bootstrap mesh rides the management network (the roster hostnames);
# all data traffic moves to the fabric after the fi-address exchange.
################################################################################

# 63 workers + 1 progress = 64 = full node.  The progress thread lands on
# the base-order tail (last core of the last package) by placement policy.
worker_threads=63
progress_threads=1

# Data plane: verbs RDM (ofi_rxm over InfiniBand).  The fi-name exchange
# propagates fabric addresses automatically — no IB IPs are configured here.
provider=verbs
# Pin one HCA on a multi-rail host (domain = device name, not an interface):
# fabric_domain=mlx5_0

pin=1
route_table_size=16
ports=25000
core_dump=1
